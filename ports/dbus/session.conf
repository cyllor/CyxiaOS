<!-- Foreground session broker for CyxiaOS's implemented UID 0 domain.
     EXTERNAL authenticates the actual connected process through SO_PEERCRED.
     No service directories, activation helper, system policy, or user switch.
     Runtime preparation creates /run/user/0 with mode 0700 before launch. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:path=/run/user/0/bus</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <deny user="*"/>
    <allow user="0"/>
    <deny own="*"/>
    <deny send_destination="*"/>
    <deny receive_sender="*"/>
  </policy>
  <policy user="0">
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
  <limit name="max_incoming_bytes">8388608</limit>
  <limit name="max_outgoing_bytes">8388608</limit>
  <limit name="max_message_size">1048576</limit>
  <limit name="max_incoming_unix_fds">16</limit>
  <limit name="max_outgoing_unix_fds">16</limit>
  <limit name="max_message_unix_fds">8</limit>
  <limit name="max_completed_connections">16</limit>
  <limit name="max_incomplete_connections">8</limit>
  <limit name="max_connections_per_user">16</limit>
  <limit name="max_names_per_connection">64</limit>
  <limit name="max_match_rules_per_connection">128</limit>
  <limit name="max_replies_per_connection">64</limit>
  <limit name="auth_timeout">30000</limit>
  <limit name="pending_fd_timeout">30000</limit>
</busconfig>
