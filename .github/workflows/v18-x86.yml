name: V0.18 x86 development

on:
  push:
    branches: [CyxiaOS-V0.18]
  pull_request:
    branches: [CyxiaOS-V0.18]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned toolchain and dependencies
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --component clippy --target x86_64-unknown-none
          rustup override set 1.95.0
          cargo fetch --locked
      - name: Verify layout and version
        run: |
          test "$(cat VERSION)" = 0.18.0-dev
          python3 -B tools/check_kernel_layout.py
          git diff --check
      - name: Shared runtime and PC component tests
        run: |
          cargo test --locked --offline -p cyxia-kernel-core -p cyxia-prototype -p cyxia-peer-billing -p cyxia-arch-x86_64 -p cyxia-platform-pc -p cyxia-arch --features cyxia-prototype/hardware-sha256
          python3 -B -m unittest discover -s tools -p test_x86_64.py -v
          python3 -B -m unittest discover -s tools -p test_verify_v17_a03_demand.py -v
      - name: Immutable journal snapshots and file capabilities
        env:
          PYTHONPATH: tools:tests/host
        run: |
          python3 -B -m unittest \
            tests.host.test_v13_disk \
            tests.host.test_v13_filesystem \
            tests.host.test_v2_filesystem \
            tests.host.test_snapshot_file_abi \
            tests.host.test_snapshot_capability_custody \
            tests.host.test_snapshot_probe_budget \
            tools.test_snapshot_probe -v
      - name: COSMIC and POSIX host regressions
        env:
          PYTHONPATH: tools:tests/host
        run: |
          test -x /usr/bin/git
          python3 -B -m unittest \
            tools.test_cosmic_notifications_dependencies \
            tools.test_cosmic_notifications_source \
            tools.test_cosmic_notifications_toolchain \
            tools.test_cosmic_notifications_elf \
            tools.test_install_cosmic_notifications -v
          python3 -B -m unittest \
            tools.test_os_smoke \
            test_os_smoke_finalization \
            test_build_pipe_capacity_probe \
            tests.host.test_prototype_evidence \
            test_child_exit_custody -v
          cargo test --locked --offline -p cyxia-posix --test pc_clock --test x86_signal
      - name: Build PC images and enforce clippy
        run: |
          python3 -B tools/build.py --output artifacts/v018-ci-dev
          python3 -B tools/build.py --profile release --output artifacts/v018-ci-release
          cargo clippy --locked --offline -p cyxia-kernel --target x86_64-unknown-none --features selftest -- -D warnings
      - name: Record exact source
        if: always()
        run: |
          mkdir -p artifacts/v018-source
          git rev-parse HEAD > artifacts/v018-source/commit.txt
          git rev-parse HEAD^{tree} > artifacts/v018-source/tree.txt
          git archive --format=tar.gz --prefix=CyxiaOS-V0.18/ --output=artifacts/v018-source/source.tar.gz HEAD
          sha256sum artifacts/v018-source/source.tar.gz > artifacts/v018-source/source.sha256
      - name: Retain build and source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v018-x86-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          retention-days: 3
          path: |
            artifacts/v018-ci-dev/
            artifacts/v018-ci-release/
            artifacts/v018-source/
      # QEMU/KVM execution is a separate source-bound native capture, not implied by CI build success.
