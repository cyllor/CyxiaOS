# Probe generation 10: validate bounded task credit settlement and single-node restart scope
name: Native replay current

on:
  push:
    branches:
      - fix/first-level-subsystems-20261024
      - CyxiaOS-V0.1
      - CyxiaOS-V0.11
      - codex/cyxiaos-v0.11-complete-prototype
    paths:
      - '.github/workflows/native-replay-current.yml'
      - 'kernel/**'
      - 'crates/arch-aarch64/**'
      - 'crates/prototype/**'
      - 'user/prototype-cluster/**'
      - 'tools/verify_domains.py'
      - 'tools/verify_m1.py'
      - 'tools/build_unified.py'
      - 'tools/check_v13_preparation_stack.py'
      - 'tools/qemu/**'
      - 'tools/test_check_v13_preparation_stack.py'
      - 'tests/host/test_preparation_stack_gate.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned native toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt --component clippy --component llvm-tools-preview --target aarch64-unknown-none --target aarch64-unknown-none-softfloat
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang make pkg-config libglib2.0-dev libpixman-1-dev libfdt-dev ninja-build python3-venv
          cargo fetch --locked
          mkdir -p "$RUNNER_TEMP/native-replay-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/native-replay-evidence/source-commit.txt"
          rustc -vV > "$RUNNER_TEMP/native-replay-evidence/rust-version.txt"
      - name: Build exact patched QEMU 10.2.2
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/qemu/qemu.git "$RUNNER_TEMP/qemu"
          git -C "$RUNNER_TEMP/qemu" checkout --detach f8ed81651e61d9c2166df6121ce2af0f44f06b3e
          test "$(git -C "$RUNNER_TEMP/qemu" rev-parse HEAD)" = f8ed81651e61d9c2166df6121ce2af0f44f06b3e
          git -C "$RUNNER_TEMP/qemu" apply --check "$GITHUB_WORKSPACE/tools/qemu/cyxia-per-vcpu-pmu.patch"
          git -C "$RUNNER_TEMP/qemu" apply "$GITHUB_WORKSPACE/tools/qemu/cyxia-per-vcpu-pmu.patch"
          git -C "$RUNNER_TEMP/qemu" diff --check
          cd "$RUNNER_TEMP/qemu"
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-opengl \
            --disable-werror
          ninja -C build qemu-system-aarch64
          build/qemu-system-aarch64 --version | tee "$RUNNER_TEMP/native-replay-evidence/qemu-version.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/native-replay-evidence/qemu-source-commit.txt"
          git diff --binary > "$RUNNER_TEMP/native-replay-evidence/qemu-source.patch"
          sha256sum "$GITHUB_WORKSPACE/tools/qemu/cyxia-per-vcpu-pmu.patch" > "$RUNNER_TEMP/native-replay-evidence/qemu-patch.sha256"
          sha256sum build/qemu-system-aarch64 > "$RUNNER_TEMP/native-replay-evidence/qemu-system-aarch64.sha256"
      - name: Build exact native pair and replay tools
        run: |
          set -o pipefail
          retain_unified_logs() {
            mkdir -p "$RUNNER_TEMP/native-replay-evidence/unified-build"
            if [ -d "$RUNNER_TEMP/unified-build" ]; then
              find "$RUNNER_TEMP/unified-build" -maxdepth 1 -type f \
                \( -name '*.log' -o -name '*-stack.json' -o -name 'build-manifest.json' \) \
                -exec cp -f {} "$RUNNER_TEMP/native-replay-evidence/unified-build/" \;
            fi
          }
          trap retain_unified_logs EXIT
          python3 user/prototype-cluster/tools/provision.py "$RUNNER_TEMP/pair" 2>&1 | tee "$RUNNER_TEMP/native-replay-evidence/provision.log"
          cargo build --locked --offline -p cyxia-prototype --example prototype-disk --example verify-domain-evidence 2>&1 | tee "$RUNNER_TEMP/native-replay-evidence/replay-tools-build.log"
          python3 tools/build_unified.py --identity-a "$RUNNER_TEMP/pair/a" --identity-b "$RUNNER_TEMP/pair/b" --output "$RUNNER_TEMP/unified-build" --selftest 2>&1 | tee "$RUNNER_TEMP/native-replay-evidence/unified-build.log"
      - name: Recompute both native preparation stack paths
        run: |
          set -euo pipefail
          for node in a b; do
            python3 tools/check_v13_preparation_stack.py \
              "$RUNNER_TEMP/unified-build/node-$node.elf" \
              > "$RUNNER_TEMP/native-replay-evidence/ci-node-$node-stack.json"
          done
      - name: Run first protected native replay pair
        run: |
          set -o pipefail
          python3 tools/verify_domains.py \
            --elf "$RUNNER_TEMP/unified-build/node-a.elf" \
            --peer-elf "$RUNNER_TEMP/unified-build/node-b.elf" \
            --build-manifest "$RUNNER_TEMP/unified-build/build-manifest.json" \
            --source-root . \
            --qemu "$RUNNER_TEMP/qemu/build/qemu-system-aarch64" \
            --output "$RUNNER_TEMP/native-replay-evidence/run" \
            --timeout 600 --hold 1 --sample-ms 250 --clock-profile wallclock \
            --replay-pairs 1 2>&1 | tee "$RUNNER_TEMP/native-replay-evidence/native-replay.log"
      - name: Run every same-boot service restart boundary
        if: ${{ always() && !cancelled() }}
        run: |
          set -uo pipefail
          status_file="$RUNNER_TEMP/native-replay-evidence/service-restart-status.tsv"
          overall=0
          while read -r profile expectation; do
            build="$RUNNER_TEMP/service-restart-$profile-build"
            evidence="$RUNNER_TEMP/native-replay-evidence/service-restart-$profile"
            build_log="$RUNNER_TEMP/native-replay-evidence/service-restart-$profile-build.log"
            set +e
            python3 tools/build_unified.py \
              --identity-a "$RUNNER_TEMP/pair/a" \
              --identity-b "$RUNNER_TEMP/pair/b" \
              --output "$build" --selftest --service-fault "$profile" \
              2>&1 | tee "$build_log"
            build_status=${PIPESTATUS[0]}
            set -e
            if [ "$build_status" -ne 0 ]; then
              printf '%s\t%s\tBUILD_FAIL\t%s\n' "$profile" "$expectation" "$build_status" >> "$status_file"
              overall=1
              continue
            fi
            cp "$build/build-manifest.json" "$RUNNER_TEMP/native-replay-evidence/service-restart-$profile-build-manifest.json"
            set +e
            python3 tools/verify_unified.py \
              --elf "$build/node-a.elf" \
              --peer-elf "$build/node-b.elf" \
              --public "$build/node-a.pub" \
              --public "$build/node-b.pub" \
              --package "$build/task.elf" \
              --build-manifest "$build/build-manifest.json" \
              --qemu "$RUNNER_TEMP/qemu/build/qemu-system-aarch64" \
              --qemu-source "$RUNNER_TEMP/qemu" \
              --output "$evidence" \
              --expect "$expectation" \
              --clock-profile wallclock --tcg-threads multi --timeout 180 \
              2>&1 | tee "$RUNNER_TEMP/native-replay-evidence/service-restart-$profile.log"
            run_status=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\tRUN\t%s\n' "$profile" "$expectation" "$run_status" >> "$status_file"
            if [ "$run_status" -ne 0 ]; then overall=1; fi
          done <<'EOF'
          after-ready service-restart-ready
          after-reserve service-restart-reserve
          after-start service-restart-start
          after-completion service-restart-completion
          after-result-record service-restart-result
          EOF
          exit "$overall"
      - name: Retain raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-replay-current-${{ github.sha }}
          retention-days: 2
          if-no-files-found: error
          compression-level: 6
          path: ${{ runner.temp }}/native-replay-evidence/
