name: V0.19 core advisory smoke (NOT release acceptance)

on:
  push:
    branches: [CyxiaOS-V0.19]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v019-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisory-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2 # HEAD^ is required by the source-diff check
      - name: Pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup override set 1.95.0
          cargo fetch --locked
      - name: Assert WIP version and v18 snapshot inheritance
        run: |
          test "$(cat VERSION)" = 0.19.0-dev
          test -f crates/prototype/src/snapshot/manager.rs
          test -f crates/kernel-core/src/control_plane/advisory.rs
          git diff --check HEAD^ HEAD
      - name: Core fixed-control and six-track host contract tests
        run: |
          cargo test --locked --offline -p cyxia-kernel-core
          cargo test --locked --offline -p cyxia-kernel-core --test control_plane
          cargo test --locked --offline -p cyxia-prototype --lib v019_fixed_tests
      - name: Prototype scheduler and task lifecycle host tests
        run: cargo test --locked --offline -p cyxia-prototype --test domain_tasks
      - name: VirtIO DMA/FLUSH, redo crash cuts and immutable snapshot regressions
        run: |
          cargo test --locked --offline -p cyxia-driver-virtio
          cargo test --locked --offline -p cyxia-prototype --test journal
          cargo test --locked --offline -p cyxia-prototype --test immutable_snapshots
      - name: Independent local Echo TLS and legacy TLS compatibility
        run: |
          cargo test --locked --offline -p cyxia-net-transport --features tls
          cargo test --locked --offline -p cyxia-cluster-transport --features tls
      - name: AArch64 EL0 TLS target compile (NOT QEMU evidence)
        run: |
          # Kernel remains aarch64-unknown-none-softfloat; EL0 TLS/ring is
          # built for the existing aarch64-unknown-none FP/SIMD target.
          rustup target add aarch64-unknown-none --toolchain 1.95.0
          CC_aarch64_unknown_none=clang \
          CFLAGS_aarch64_unknown_none="--target=aarch64-none-elf -ffreestanding -fno-stack-protector -mno-outline-atomics -DRING_CORE_NOSTDLIBINC" \
          cargo check --release --locked --offline -p cyxia-net-transport --features tls --target aarch64-unknown-none
      - name: Native source wiring regression (NOT a native pass)
        run: python3 -B -m unittest tools.test_v19_native_security_source -v
      - name: Archive exact branch commit (not a release)
        if: always()
        run: |
          mkdir -p artifacts/v019-wip-source
          git rev-parse HEAD > artifacts/v019-wip-source/commit.txt
          git archive --format=tar.gz --prefix=CyxiaOS-V0.19/ --output=artifacts/v019-wip-source/source.tar.gz HEAD
          sha256sum artifacts/v019-wip-source/source.tar.gz > artifacts/v019-wip-source/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v019-wip-source-${{ github.sha }}
          retention-days: 7
          path: artifacts/v019-wip-source/
