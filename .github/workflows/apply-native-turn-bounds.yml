name: Apply bounded native EL0 turns

on:
  push:
    branches:
      - fix/first-level-subsystems-20261024
    paths:
      - '.github/workflows/apply-native-turn-bounds.yml'

permissions:
  contents: write

concurrency:
  group: apply-native-turn-bounds
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/first-level-subsystems-20261024
          fetch-depth: 0
      - name: Install pinned formatter
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt
      - name: Apply exact patch and self-remove
        env:
          BRANCH: fix/first-level-subsystems-20261024
          PATCH_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > "$RUNNER_TEMP/native-turn.patch"
          git apply --check "$RUNNER_TEMP/native-turn.patch"
          git apply "$RUNNER_TEMP/native-turn.patch"
          cargo +1.95.0 fmt --all
          rm -f .github/workflows/apply-native-turn-bounds.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: isolate native timer returns within control credit"
          git push origin "HEAD:$BRANCH"
