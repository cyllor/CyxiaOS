name: Source snapshot

on:
  push:
    branches:
      - fix/first-level-subsystems-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Create exact source archive
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/CyxiaOS-source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/CyxiaOS-source.tar.gz" > "$RUNNER_TEMP/CyxiaOS-source.tar.gz.sha256"
      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cyxia-source-${{ github.sha }}
          retention-days: 1
          compression-level: 0
          path: |
            ${{ runner.temp }}/CyxiaOS-source.tar.gz
            ${{ runner.temp }}/CyxiaOS-source.tar.gz.sha256
            ${{ runner.temp }}/source-commit.txt
