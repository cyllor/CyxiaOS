name: Diagnose TLS guest compile

on:
  push:
    branches:
      - codex/v011-tls-exit-diagnostics
    paths:
      - '.github/workflows/codex-debug-tls-guest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reassemble reviewed patch
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/tls-exit-diagnostics.patch.gz.b64"
          patch="$RUNNER_TEMP/tls-exit-diagnostics.patch"
          parts=(.github/codex/patches/tls-exit-diagnostics.part-{00..08})
          cat "${parts[@]}" > "$payload"
          printf '%s  %s\n' \
            ab105948ebc775ea371d011a22fa1c7774b3b21b10e5ad760d7fc4b8e8a7872b \
            "$payload" | sha256sum --check --strict -
          base64 --decode "$payload" | gzip --decompress > "$patch"
          printf '%s  %s\n' \
            49c3a3d6bd39cd3a2a76cabcc775ff3b496f13cf8f385a771b27b0d1bc8b9496 \
            "$patch" | sha256sum --check --strict -
          git apply --check "$patch"
          git apply "$patch"
          cat > user/prototype-cluster/src/session_exit.rs <<'EOF'
          //! Bounded, non-authoritative TLS session-exit diagnostics. These codes explain
          //! why the EL0 service left one session; they never grant identity or recovery.
          #[derive(Clone, Copy, Debug, PartialEq, Eq)]
          #[repr(u16)]
          pub enum SessionExitReason {
              ConnectionLost = 1,
              ClockUnavailable = 2,
              DomainTick = 3,
              TcpRead = 4,
              TlsReceive = 5,
              TlsPump = 6,
              HandshakeTicket = 7,
              HandshakeFinish = 8,
              EnterAuthenticated = 9,
              PlaintextIngest = 10,
              PlaintextConsume = 11,
              DriverTick = 12,
              ReplayReconnect = 13,
              TlsEgress = 14,
          }
          impl SessionExitReason {
              pub const EVENT_BASE: u64 = 0x230;
              pub const fn trace_event(self) -> u64 {
                  Self::EVENT_BASE + self as u64
              }
          }
          EOF
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update \
            --component rustfmt --component clippy \
            --target aarch64-unknown-none
          cargo fetch --locked --manifest-path user/prototype-cluster/Cargo.toml
      - name: Compile exact service-fault guest
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/tls-guest-diagnostic"
          cargo fmt --manifest-path user/prototype-cluster/Cargo.toml
          python3 user/prototype-cluster/tools/provision.py "$RUNNER_TEMP/pair" \
            2>&1 | tee "$RUNNER_TEMP/tls-guest-diagnostic/provision.log"
          provision=${PIPESTATUS[0]}
          if [ "$provision" -ne 0 ]; then exit "$provision"; fi
          CYXIA_CLUSTER_IDENTITY="$RUNNER_TEMP/pair/a" \
          CYXIA_CLUSTER_FAULT=after-ready \
          cargo clippy --locked --offline \
            --manifest-path user/prototype-cluster/Cargo.toml \
            --features guest --bin cyxia-prototype-cluster \
            --target aarch64-unknown-none -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/tls-guest-diagnostic/guest-clippy.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/tls-guest-diagnostic/status.txt"
          exit "$status"
      - name: Upload compiler diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tls-guest-diagnostic-${{ github.sha }}
          retention-days: 2
          if-no-files-found: error
          path: ${{ runner.temp }}/tls-guest-diagnostic/
