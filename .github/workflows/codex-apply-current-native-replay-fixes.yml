name: Apply current native replay fixes

on:
  push:
    branches:
      - codex/cyxiaos-v0.11-complete-prototype

permissions:
  contents: write

concurrency:
  group: apply-current-native-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ startsWith(github.event.head_commit.message, 'apply current native replay fix patch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: tools
    steps:
      - name: Check out writable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update \
            --component rustfmt --component clippy \
            --target aarch64-unknown-none-softfloat
          cargo fetch --locked
      - name: Apply exact repair and format
        run: |
          set -euo pipefail
          patch=.github/codex/patches/120-current-native-replay-fixes.diff.gz
          echo '907b5aad09ab70228f10695557f8d7d53156622dd8ca45d5223890b96b497ff6  '"$patch" | sha256sum -c -
          gzip -dc "$patch" > "$RUNNER_TEMP/current-native-replay-fixes.diff"
          git apply --check "$RUNNER_TEMP/current-native-replay-fixes.diff"
          git apply "$RUNNER_TEMP/current-native-replay-fixes.diff"
          cargo fmt --all
          git diff --check
      - name: Run focused correctness gates
        run: |
          set -euo pipefail
          python3 -B -m unittest -v \
            tests.host.test_build_unified \
            tests.host.test_unified_acceptance \
            tests.host.test_v13_native_task_credit
          cargo test --locked --offline -p cyxia-driver-virtio
          cargo clippy --locked --offline -p cyxia-kernel \
            --target aarch64-unknown-none-softfloat \
            --features smp-selftest -- -D warnings
      - name: Commit validated source only
        run: |
          set -euo pipefail
          git rm \
            .github/codex/patches/120-current-native-replay-fixes.diff.gz \
            .github/workflows/codex-apply-current-native-replay-fixes.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(native): bound replay credits and isolate restart fault'
          git push origin HEAD:codex/cyxiaos-v0.11-complete-prototype
