name: Apply native credit diagnostics v2

on:
  push:
    branches:
      - fix/first-level-subsystems-20261024
    paths:
      - '.github/workflows/apply-native-credit-diagnostics-v2.yml'

permissions:
  contents: write

concurrency:
  group: apply-native-credit-diagnostics-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/first-level-subsystems-20261024
          fetch-depth: 0
      - name: Apply tested diagnostic patch
        env:
          BRANCH: fix/first-level-subsystems-20261024
          PATCH_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > "$RUNNER_TEMP/native-credit.patch"
          git apply --check "$RUNNER_TEMP/native-credit.patch"
          git apply "$RUNNER_TEMP/native-credit.patch"
          PYTHONPATH=tools python3 -B -m unittest tools.test_verify_domains -v
          rm -f .github/workflows/apply-native-credit-diagnostics.yml
          rm -f .github/workflows/apply-native-credit-diagnostics-v2.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: report active domain on native credit failure"
          git push origin "HEAD:$BRANCH"
