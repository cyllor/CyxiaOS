# These are native mechanism fixtures only, NOT full V0.20 ARM/x86 acceptance.
name: V0.20 two-architecture native mechanism capture (WIP)

on:
  push:
    branches: [CyxiaOS-V0.20, work/v020-native-control-safety, fix/v020-v0199-contract-gaps, work/v020-gap-x86-native-firmware]
    paths:
      - '.github/workflows/v20-native-mechanism.yml'
      - 'kernel/**'
      - 'crates/kernel-core/**'
      - 'crates/prototype/**'
      - 'crates/arch-aarch64/**'
      - 'crates/arch-x86_64/**'
      - 'crates/driver-gicv2/**'
      - 'crates/driver-virtio/**'
      - 'crates/platform-virt/**'
      - 'tools/verify_smp.py'
      - 'tools/verify_v0199_cpu0_roles.py'
      - 'tools/x86_64.py'
  # The workflow change itself receives a real PR run; after integration
  # relevant main-branch pushes automatically run on the merged source tree.
  # Avoid rebuilding QEMU on every independent component-review branch.
  pull_request:
    branches: [CyxiaOS-V0.20]
    paths:
      - '.github/workflows/v20-native-mechanism.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v020-native-mechanism-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qemu-pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang make ninja-build pkg-config libglib2.0-dev libpixman-1-dev libfdt-dev python3-venv
      - name: Build pinned QEMU 10.2.2 for both guests
        run: |
          set -euo pipefail
          mkdir -p artifacts/v020-qemu
          git clone --filter=blob:none --no-checkout https://github.com/qemu/qemu.git "$RUNNER_TEMP/qemu-source"
          git -C "$RUNNER_TEMP/qemu-source" checkout --detach f8ed81651e61d9c2166df6121ce2af0f44f06b3e
          test "$(git -C "$RUNNER_TEMP/qemu-source" rev-parse HEAD)" = f8ed81651e61d9c2166df6121ce2af0f44f06b3e
          cd "$RUNNER_TEMP/qemu-source"
          ./configure --target-list=aarch64-softmmu,x86_64-softmmu --disable-docs --disable-gtk --disable-sdl --disable-opengl --disable-werror 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/v020-qemu/configure.log"
          ninja -C build qemu-system-aarch64 qemu-system-x86_64 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/v020-qemu/build.log"
          mkdir -p "$RUNNER_TEMP/qemu-bin"
          cp build/qemu-system-aarch64 build/qemu-system-x86_64 "$RUNNER_TEMP/qemu-bin/"
          # Standalone QEMU cannot find its built-in PC BIOS unless the pinned
          # pc-bios directory is shipped alongside the binary and explicitly -L.
          cp -a pc-bios "$RUNNER_TEMP/qemu-bin/pc-bios"
          test -s "$RUNNER_TEMP/qemu-bin/pc-bios/bios-256k.bin"
          sha256sum "$RUNNER_TEMP/qemu-bin/pc-bios/bios-256k.bin" \
            > "$GITHUB_WORKSPACE/artifacts/v020-qemu/sea-bios-256k.sha256"
          "$RUNNER_TEMP/qemu-bin/qemu-system-aarch64" --version | tee "$GITHUB_WORKSPACE/artifacts/v020-qemu/arm-version.txt"
          "$RUNNER_TEMP/qemu-bin/qemu-system-x86_64" --version | tee "$GITHUB_WORKSPACE/artifacts/v020-qemu/x86-version.txt"
          sha256sum "$RUNNER_TEMP"/qemu-bin/qemu-system-* | tee "$GITHUB_WORKSPACE/artifacts/v020-qemu/binaries.sha256"
          tar -C "$RUNNER_TEMP" -czf "$GITHUB_WORKSPACE/artifacts/v020-qemu/qemu-bin.tar.gz" qemu-bin
          (cd "$GITHUB_WORKSPACE/artifacts/v020-qemu" && sha256sum qemu-bin.tar.gz > archive.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v020-pinned-qemu-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: artifacts/v020-qemu/

  arm-smp-fixture:
    needs: qemu-pinned
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v020-pinned-qemu-${{ github.sha }}
          path: qemu-evidence
      - name: Install toolchain and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfdt1 libglib2.0-0 libpixman-1-0
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --target aarch64-unknown-none-softfloat
          rustup override set 1.95.0
          cargo fetch --locked
      - name: Run actual four-vCPU AArch64 SMP mechanism fixture
        run: |
          set -euo pipefail
          (cd qemu-evidence && sha256sum -c archive.sha256)
          tar -xzf qemu-evidence/qemu-bin.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/qemu-bin" >> "$GITHUB_PATH"
          cargo build --locked --offline -p cyxia-kernel --target aarch64-unknown-none-softfloat --features smp-selftest
          mkdir -p artifacts/v020-arm-native
          git rev-parse HEAD > artifacts/v020-arm-native/commit.txt
          git rev-parse HEAD^{tree} > artifacts/v020-arm-native/tree.txt
          cp target/aarch64-unknown-none-softfloat/debug/cyxia-kernel artifacts/v020-arm-native/kernel.elf
          sha256sum artifacts/v020-arm-native/kernel.elf > artifacts/v020-arm-native/kernel.sha256
          PATH="$RUNNER_TEMP/qemu-bin:$PATH" python3 tools/verify_smp.py \
            --elf artifacts/v020-arm-native/kernel.elf \
            --output artifacts/v020-arm-native/capture --timeout 30 \
            2>&1 | tee artifacts/v020-arm-native/verify.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v020-arm-smp-fixture-${{ github.sha }}
          retention-days: 7
          path: artifacts/v020-arm-native/

  x86-smp-fixture:
    needs: qemu-pinned
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v020-pinned-qemu-${{ github.sha }}
          path: qemu-evidence
      - name: Install toolchain and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfdt1 libglib2.0-0 libpixman-1-0
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --target x86_64-unknown-none
          rustup override set 1.95.0
          cargo fetch --locked
      - name: Run actual four-vCPU x86-64 SMP mechanism fixture
        run: |
          set -euo pipefail
          (cd qemu-evidence && sha256sum -c archive.sha256)
          tar -xzf qemu-evidence/qemu-bin.tar.gz -C "$RUNNER_TEMP"
          mkdir -p artifacts/v020-x86-native
          git rev-parse HEAD > artifacts/v020-x86-native/commit.txt
          git rev-parse HEAD^{tree} > artifacts/v020-x86-native/tree.txt
          python3 tools/x86_64.py build --output artifacts/v020-x86-native/build --mechanism smp
          CYXIA_PINNED_QEMU_FIRMWARE="$RUNNER_TEMP/qemu-bin/pc-bios" \
            PATH="$RUNNER_TEMP/qemu-bin:$PATH" python3 tools/x86_64.py run \
            --build artifacts/v020-x86-native/build \
            --output artifacts/v020-x86-native/capture --timeout 35
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v020-x86-smp-fixture-${{ github.sha }}
          retention-days: 7
          path: artifacts/v020-x86-native/

  cpu0-role-fixture:
    # Share the pinned QEMU build, but use a distinct freshly built guest
    # and evidence. This fixture is NOT the production eight-service OS.
    needs: qemu-pinned
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v020-pinned-qemu-${{ github.sha }}
          path: qemu-evidence
      - name: Install toolchain and QEMU runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfdt1 libglib2.0-0 libpixman-1-0
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --target aarch64-unknown-none-softfloat
          rustup override set 1.95.0
          cargo fetch --locked
      - name: Run real CPU0 eight-EL0-context mechanism fixture
        run: |
          set -euo pipefail
          (cd qemu-evidence && sha256sum -c archive.sha256)
          tar -xzf qemu-evidence/qemu-bin.tar.gz -C "$RUNNER_TEMP"
          mkdir -p artifacts/v020-cpu0-native
          git rev-parse HEAD > artifacts/v020-cpu0-native/commit.txt
          git rev-parse HEAD^{tree} > artifacts/v020-cpu0-native/tree.txt
          printf '%s\n' 'MECHANISM_FIXTURE_ONLY; G0 BLOCKED; G4 NOT_RUN' > artifacts/v020-cpu0-native/scope.txt
          cargo build --locked --offline -p cyxia-kernel --target aarch64-unknown-none-softfloat --features v0199-cpu0-role-selftest \
            2>&1 | tee artifacts/v020-cpu0-native/build.log
          cp target/aarch64-unknown-none-softfloat/debug/cyxia-kernel artifacts/v020-cpu0-native/kernel.elf
          sha256sum artifacts/v020-cpu0-native/kernel.elf > artifacts/v020-cpu0-native/kernel.sha256
          PATH="$RUNNER_TEMP/qemu-bin:$PATH" python3 -B tools/verify_v0199_cpu0_roles.py \
            --elf artifacts/v020-cpu0-native/kernel.elf \
            --output artifacts/v020-cpu0-native/capture --timeout 45 \
            2>&1 | tee artifacts/v020-cpu0-native/verification.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v020-cpu0-integrated-fixture-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: artifacts/v020-cpu0-native/
