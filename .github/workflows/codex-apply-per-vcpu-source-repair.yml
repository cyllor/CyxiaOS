name: Repair replay CPU clock

on:
  push:
    branches:
      - codex/cyxiaos-v0.1-complete-prototype

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-replay-cpu-clock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-build-and-commit:
    if: "${{ startsWith(github.event.head_commit.message, 'diagnostic: repair Prefix CPU clock') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
      TARGET_BRANCH: codex/cyxiaos-v0.1-complete-prototype
    steps:
      - name: Check out writable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Repair the three stale Prefix initializers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          fixture = Path('kernel/src/domain_control/replay/fixture.rs')
          replay = Path('kernel/src/domain_control/replay.rs')

          fixture_text = fixture.read_text()
          old_fixture = '        start: now(),\n'
          new_fixture = (
              '        cpu_started: cyxia_arch_aarch64::timer::cpu_ticks(),\n'
          )
          if fixture_text.count(old_fixture) != 2:
              raise SystemExit('expected exactly two stale fixture Prefix clocks')
          fixture.write_text(fixture_text.replace(old_fixture, new_fixture))

          replay_text = replay.read_text()
          old_replay = '            start: at,\n'
          new_replay = (
              '            cpu_started: cyxia_arch_aarch64::timer::cpu_ticks(),\n'
          )
          if replay_text.count(old_replay) != 1:
              raise SystemExit('expected exactly one stale baseline Prefix clock')
          replay.write_text(replay_text.replace(old_replay, new_replay))
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = \
            "kernel/src/domain_control/replay.rs kernel/src/domain_control/replay/fixture.rs "

      - name: Install pinned native toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 \
            --profile minimal \
            --no-self-update \
            --component rustfmt \
            --component clippy \
            --component llvm-tools-preview \
            --target aarch64-unknown-none \
            --target aarch64-unknown-none-softfloat
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang make pkg-config libglib2.0-dev libpixman-1-dev \
            libfdt-dev ninja-build python3-venv
          cargo fetch --locked

      - name: Run formatting and kernel compile gates
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = \
            "kernel/src/domain_control/replay.rs kernel/src/domain_control/replay/fixture.rs "
          cargo clippy --locked --offline \
            -p cyxia-kernel \
            --target aarch64-unknown-none-softfloat \
            --features smp-selftest \
            -- -D warnings

      - name: Build the exact unified AArch64 pair
        run: |
          set -euo pipefail
          python3 user/prototype-cluster/tools/provision.py "$RUNNER_TEMP/pair"
          python3 tools/build_unified.py \
            --identity-a "$RUNNER_TEMP/pair/a" \
            --identity-b "$RUNNER_TEMP/pair/b" \
            --output "$RUNNER_TEMP/unified-build" \
            --selftest
          test -s "$RUNNER_TEMP/unified-build/node-a.elf"
          test -s "$RUNNER_TEMP/unified-build/node-b.elf"
          test -s "$RUNNER_TEMP/unified-build/build-manifest.json"

      - name: Commit only the verified source repair
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- .github/workflows)"
          test "$(git diff --name-only | sort | tr '\n' ' ')" = \
            "kernel/src/domain_control/replay.rs kernel/src/domain_control/replay/fixture.rs "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            kernel/src/domain_control/replay.rs \
            kernel/src/domain_control/replay/fixture.rs
          git diff --cached --check
          git commit -m 'fix: use per-vCPU clock for replay prefixes'
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Dispatch authoritative validation and native replay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run codex-source-snapshot.yml --ref "$TARGET_BRANCH"
