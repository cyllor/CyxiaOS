name: Apply native credit diagnostics

on:
  push:
    branches:
      - fix/first-level-subsystems-20261024
    paths:
      - '.github/workflows/apply-native-credit-diagnostics.yml'

permissions:
  contents: write

concurrency:
  group: apply-native-credit-diagnostics
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/first-level-subsystems-20261024
          fetch-depth: 0
      - name: Add exact active-job diagnostics
        env:
          BRANCH: fix/first-level-subsystems-20261024
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/verify_domains.py')
          source = path.read_text()
          changes = (
              (
                  '    complete = []\n    for slot in range(64):\n',
                  '    complete = []\n    active = []\n    for slot in range(64):\n',
              ),
              (
                  '''        if r[639] & 1 or r[0] == 0 or r[30] == 0:
            continue
        require(r[0] == r[1] and r[7] == w[2], "record identity mismatch")
''',
                  '''        if r[639] & 1 or r[0] == 0:
            continue
        active.append({
            "slot": slot, "sequence": r[0], "domain": r[2], "kind": r[3],
            "target_id": r[4], "target_generation": r[5],
            "candidate_count": r[16], "approved_version": r[13],
            "executor_state": r[14], "complete": bool(r[30]),
        })
        if r[30] == 0:
            continue
        require(r[0] == r[1] and r[7] == w[2], "record identity mismatch")
''',
              ),
              (
                  '        "aborted": w[10], "applied_objects": complete,\n',
                  '        "aborted": w[10], "applied_objects": complete,\n        "active_records": active,\n',
              ),
              (
                  '''    for symbol_name, key, parser in (("CONTROL_CREDIT_EVIDENCE", "control_credit", parse_control_credit),
                                     ("RUNTIME_V13_EVIDENCE", "runtime", parse_runtime),
''',
                  '''    for symbol_name, key, parser in (("DOMAIN_CONTROL_EVIDENCE", "control", parse_control),
                                     ("CONTROL_CREDIT_EVIDENCE", "control_credit", parse_control_credit),
                                     ("RUNTIME_V13_EVIDENCE", "runtime", parse_runtime),
''',
              ),
              (
                  '''                check(key, not guest[key],
                      "native C credit failure: " + json.dumps(guest[key], separators=(",", ":")))
''',
                  '''                detail = {
                    "failures": guest[key],
                    "active_records": (guest.get("control") or {}).get("active_records", []),
                }
                check(key, not guest[key],
                      "native C credit failure: " + json.dumps(detail, separators=(",", ":")))
''',
              ),
          )
          for old, new in changes:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact match, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          python3 -B -m unittest tools.test_verify_domains -v
          rm -f .github/workflows/apply-native-credit-diagnostics.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: report active domain on native credit failure"
          git push origin "HEAD:$BRANCH"
