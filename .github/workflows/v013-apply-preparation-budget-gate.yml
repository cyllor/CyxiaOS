name: Apply V0.13 preparation budget gate

on:
  push:
    branches:
      - codex/v013-preparation-credit-tail
    paths:
      - '.github/workflows/v013-apply-preparation-budget-gate.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply the common pre-registration CPU gate
        env:
          BASE_COMMIT: 1b0b49ee6b3e2e33ad4631897f37cab0652b1248
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          base = os.environ["BASE_COMMIT"]
          prep_path = Path("kernel/src/domain_control/preparation.rs")
          prep = subprocess.check_output(
              ["git", "show", f"{base}:{prep_path.as_posix()}"], text=True
          )
          import_anchor = """use cyxia_prototype::{
              domains::{Error, ObjectKey},
              policy::{ModelBinding, Snapshot},
          };
          """
          helper = """
          // Candidate registration, canonical input construction and hashing are a
          // fixed non-preemptible tail inside the enclosing 2.5 ms native control
          // credit. Stop before that tail when the measured preparation prefix has
          // already consumed this conservative share. The independent 2 ms decision
          // bound remains unchanged and is still checked by Pending and accept().
          pub const PRE_REGISTRATION_CPU_LIMIT_NS: u64 = 1_750_000;
          pub fn check_pre_registration(elapsed_ns: u64) -> Result<(), Error> {
              if elapsed_ns > PRE_REGISTRATION_CPU_LIMIT_NS {
                  Err(Error::Budget)
              } else {
                  Ok(())
              }
          }
          """
          if prep.count(import_anchor) != 1:
              raise SystemExit("preparation import anchor changed")
          prep = prep.replace(import_anchor, import_anchor + helper, 1)
          prep += """

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn pre_registration_gate_retains_tail_credit() {
                  assert_eq!(
                      check_pre_registration(PRE_REGISTRATION_CPU_LIMIT_NS),
                      Ok(())
                  );
                  assert!(matches!(
                      check_pre_registration(PRE_REGISTRATION_CPU_LIMIT_NS + 1),
                      Err(Error::Budget)
                  ));
              }
          }
          """
          prep_path.write_text(prep)

          control_path = Path("kernel/src/domain_control.rs")
          control = control_path.read_text()
          anchor = """    if let Some(pending) = s.preparation {
              pending.total(
                  preparation_identity,
                  now(),
                  timer::cpu_elapsed_ns(cpu_started),
              )?;
          }
          let evidence = if read_only {
          """
          replacement = """    if let Some(pending) = s.preparation {
              pending.total(
                  preparation_identity,
                  now(),
                  timer::cpu_elapsed_ns(cpu_started),
              )?;
          }
          preparation::check_pre_registration(timer::cpu_elapsed_ns(cpu_started))?;
          let evidence = if read_only {
          """
          if control.count(anchor) != 1:
              raise SystemExit("encode_job_inner budget anchor changed")
          control_path.write_text(control.replace(anchor, replacement, 1))
          PY
          git diff --check
      - name: Commit exact source change and remove this applicator
        run: |
          set -euo pipefail
          git rm .github/workflows/v013-apply-preparation-budget-gate.yml
          git add kernel/src/domain_control.rs kernel/src/domain_control/preparation.rs
          git config user.name cyllor
          git config user.email 45630989+cyllor@users.noreply.github.com
          git commit -m "fix(v0.13): gate preparation before fixed tail"
          git push origin HEAD:codex/v013-preparation-credit-tail
