name: Apply host SHA fixture stubs

on:
  push:
    branches:
      - fix/first-level-subsystems-20261024
    paths:
      - '.github/workflows/apply-host-sha-stubs.yml'

permissions:
  contents: write

concurrency:
  group: apply-host-sha-stubs
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - name: Check out source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/first-level-subsystems-20261024
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt
      - name: Patch host fixtures and self-remove
        env:
          BRANCH: fix/first-level-subsystems-20261024
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = (
              Path('crates/prototype/tests/learning_native_history.rs'),
              Path('crates/prototype/tests/native_serial_replay.rs'),
          )
          marker = 'extern crate self as cyxia_arch_aarch64;\n'
          replacement = '''extern crate self as cyxia_arch_aarch64;
          pub mod sha256 {
              pub fn digest_page(_: &[u8; 4096]) -> Option<[u8; 32]> {
                  None
              }
          }
          '''
          for path in files:
              source = path.read_text()
              if source.count(marker) != 1:
                  raise SystemExit(f'{path}: expected one arch alias')
              path.write_text(source.replace(marker, replacement, 1))
          PY
          cargo fmt --all
          cargo test --locked --offline -p cyxia-prototype --test learning_native_history --test native_serial_replay
          rm -f .github/workflows/apply-host-sha-stubs.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: provide host fallback for protected SHA fixtures"
          git push origin "HEAD:$BRANCH"
