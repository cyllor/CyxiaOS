# Native guest G0 *mechanism fixture*, not eight real services or full G4.
name: V0.20 CPU0 eight EL0 TTBR native fixture
on:
  push:
    branches: [work/v020-gap-cpu0-native-role-fixture]
    paths:
      - '.github/workflows/v20-cpu0-role-native.yml'
      - 'kernel/**'
      - 'crates/kernel-core/**'
      - 'crates/arch-aarch64/**'
      - 'tools/verify_v0199_cpu0_roles.py'
      - 'tools/verify_smp.py'
  pull_request:
    branches: [fix/v020-v0199-contract-gaps]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v020-cpu0-role-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qemu-pinned:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned QEMU build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang make ninja-build pkg-config libglib2.0-dev libpixman-1-dev libfdt-dev python3-venv
      - name: Build immutable QEMU 10.2.2 AArch64 from pinned commit
        run: |
          set -euo pipefail
          mkdir -p artifacts/v020-qemu-role
          git clone --filter=blob:none --no-checkout https://github.com/qemu/qemu.git "$RUNNER_TEMP/qemu-source"
          git -C "$RUNNER_TEMP/qemu-source" checkout --detach f8ed81651e61d9c2166df6121ce2af0f44f06b3e
          test "$(git -C "$RUNNER_TEMP/qemu-source" rev-parse HEAD)" = f8ed81651e61d9c2166df6121ce2af0f44f06b3e
          cd "$RUNNER_TEMP/qemu-source"
          ./configure --target-list=aarch64-softmmu --disable-docs --disable-gtk --disable-sdl --disable-opengl --disable-werror \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/v020-qemu-role/configure.log"
          ninja -C build qemu-system-aarch64 \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/v020-qemu-role/build.log"
          mkdir -p "$RUNNER_TEMP/qemu-bin"
          cp build/qemu-system-aarch64 "$RUNNER_TEMP/qemu-bin/"
          "$RUNNER_TEMP/qemu-bin/qemu-system-aarch64" --version \
            | tee "$GITHUB_WORKSPACE/artifacts/v020-qemu-role/version.txt"
          sha256sum "$RUNNER_TEMP/qemu-bin/qemu-system-aarch64" \
            > "$GITHUB_WORKSPACE/artifacts/v020-qemu-role/binary.sha256"
          tar -C "$RUNNER_TEMP" -czf "$GITHUB_WORKSPACE/artifacts/v020-qemu-role/qemu-bin.tar.gz" qemu-bin
          (cd "$GITHUB_WORKSPACE/artifacts/v020-qemu-role" && sha256sum qemu-bin.tar.gz > archive.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v020-cpu0-role-qemu-${{ github.sha }}
          retention-days: 7
          path: artifacts/v020-qemu-role/

  arm-role-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pin freestanding ARM Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --target aarch64-unknown-none-softfloat
          rustup override set 1.95.0
          cargo fetch --locked
      - name: Compile actual four-vCPU CPU0-role guest code
        run: |
          set -euo pipefail
          mkdir -p artifacts/v020-cpu0-native
          cargo build --locked --offline -p cyxia-kernel --target aarch64-unknown-none-softfloat --features v0199-cpu0-role-selftest \
            2>&1 | tee artifacts/v020-cpu0-native/build.log
          cp target/aarch64-unknown-none-softfloat/debug/cyxia-kernel artifacts/v020-cpu0-native/kernel.elf
          sha256sum artifacts/v020-cpu0-native/kernel.elf > artifacts/v020-cpu0-native/kernel.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v020-cpu0-role-elf-${{ github.sha }}
          retention-days: 7
          path: artifacts/v020-cpu0-native/

  native-role-fixture:
    needs: [qemu-pinned, arm-role-compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v020-cpu0-role-qemu-${{ github.sha }}
          path: qemu-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v020-cpu0-role-elf-${{ github.sha }}
          path: artifacts/v020-cpu0-native
      - name: Install pinned QEMU runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfdt1 libglib2.0-0 libpixman-1-0
      - name: Run pinned QEMU and attest actual guest EL0 role TTBR evidence
        run: |
          set -euo pipefail
          (cd qemu-evidence && sha256sum -c archive.sha256)
          tar -xzf qemu-evidence/qemu-bin.tar.gz -C "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/qemu-bin:$PATH" python3 -B tools/verify_v0199_cpu0_roles.py \
            --elf artifacts/v020-cpu0-native/kernel.elf \
            --output artifacts/v020-cpu0-native/capture --timeout 45 \
            2>&1 | tee artifacts/v020-cpu0-native/verification.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v020-cpu0-roles-native-${{ github.sha }}
          retention-days: 7
          path: artifacts/v020-cpu0-native/
