name: Apply borrowed candidate stack patch

on:
  push:
    branches:
      - codex/cyxiaos-v0.1-complete-prototype

permissions:
  contents: write

concurrency:
  group: complete-prototype-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ startsWith(github.event.head_commit.message, 'apply borrowed candidate stack patch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: tools
    steps:
      - name: Check out writable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update \
            --component rustfmt --component clippy --component llvm-tools-preview \
            --target aarch64-unknown-none --target aarch64-unknown-none-softfloat
          cargo fetch --locked
      - name: Apply borrowed-candidate patch and format workspace
        run: |
          set -euo pipefail
          git apply --check .github/codex/patches/080-borrow-candidate-set.diff
          git apply .github/codex/patches/080-borrow-candidate-set.diff
          cargo fmt --all
      - name: Run focused host gates
        run: |
          python3 -B -m unittest -v test_check_v13_preparation_stack
          cargo test --locked --offline -p cyxia-prototype \
            --test native_target_batch \
            --test native_preparation_debit \
            --test domain_policy \
            --test native_core_replay
          cargo clippy --locked --offline -p cyxia-kernel \
            --target aarch64-unknown-none-softfloat --features smp-selftest -- -D warnings
      - name: Build both native images and expose exact diagnostics
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/native-repair-evidence"
          python3 user/prototype-cluster/tools/provision.py "$RUNNER_TEMP/pair" \
            > "$RUNNER_TEMP/native-repair-evidence/provision.log" 2>&1
          status=0
          python3 tools/build_unified.py \
            --identity-a "$RUNNER_TEMP/pair/a" \
            --identity-b "$RUNNER_TEMP/pair/b" \
            --output "$RUNNER_TEMP/unified-build" \
            --selftest \
            > "$RUNNER_TEMP/native-repair-evidence/build-unified.log" 2>&1 || status=$?
          if [ -d "$RUNNER_TEMP/unified-build" ]; then
            cp -a "$RUNNER_TEMP/unified-build/." "$RUNNER_TEMP/native-repair-evidence/unified-build/" 2>/dev/null || true
          fi
          for log in "$RUNNER_TEMP/native-repair-evidence"/*.log "$RUNNER_TEMP/native-repair-evidence"/unified-build/*.log; do
            [ -f "$log" ] || continue
            echo "===== $log ====="
            tail -n 500 "$log"
          done
          for proof in "$RUNNER_TEMP/native-repair-evidence"/unified-build/*-stack.json; do
            [ -f "$proof" ] || continue
            echo "===== $proof ====="
            cat "$proof"
          done
          exit "$status"
      - name: Retain native repair diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: borrowed-candidate-native-diagnostics-${{ github.sha }}
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
          path: ${{ runner.temp }}/native-repair-evidence/
      - name: Commit validated formatted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(control): keep read-only candidates off wrapper stack'
          git push origin HEAD:codex/cyxiaos-v0.1-complete-prototype
