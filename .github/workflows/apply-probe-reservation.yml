name: Apply bounded boot-probe reservation

on:
  push:
    branches:
      - fix/first-level-subsystems-20261024
    paths:
      - '.github/workflows/apply-probe-reservation.yml'

permissions:
  contents: write

concurrency:
  group: apply-probe-reservation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/first-level-subsystems-20261024
          fetch-depth: 0
      - name: Install pinned formatter
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt
      - name: Separate and prepay the boot mapping probe
        env:
          BRANCH: fix/first-level-subsystems-20261024
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kernel/src/prototype_runtime/native.rs')
          source = path.read_text()

          replacements = [
              (
                  'const PREPAY_NS: u64 = 2_500_000;\nconst WALL_NS: u64 = 50_000_000;\n',
                  'const PREPAY_NS: u64 = 2_500_000;\n'
                  '// The boot mapping self-test is recovery/setup work, not one model proposal.\n'
                  '// It keeps exact actual accounting but reserves the design\'s 8 ms recovery slice.\n'
                  'const PROBE_PREPAY_NS: u64 = 8_000_000;\n'
                  'const WALL_NS: u64 = 50_000_000;\n',
              ),
              (
                  '    if !worker.probed && worker.context.is_none() && !worker.native.probing {\n'
                  '        worker.native.phase(1);\n'
                  '        worker.native.clear_next = 1;\n'
                  '        worker.native.probing = true;\n'
                  '        worker.native.probe_started = now;\n'
                  '    }\n',
                  '    if !worker.probed && worker.context.is_none() && !worker.native.probing {\n'
                  '        worker.native.phase(1);\n'
                  '        worker.native.clear_next = 1;\n'
                  '        worker.native.probing = true;\n'
                  '        worker.native.probe_started = now;\n'
                  '        // Do not combine the ownership/state transition with the first private\n'
                  '        // memory touch. The next independently prepaid turn performs the clear.\n'
                  '        return;\n'
                  '    }\n',
              ),
              (
                  '    if !learning::allow_mandatory(&worker.extra, PREPAY_NS, ns(timer::ticks())) {\n'
                  '        return;\n'
                  '    }\n'
                  '    let Ok(Some(credit)) = crate::domain_tasks::begin_control(PREPAY_NS, false) else {\n'
                  '        return;\n'
                  '    };\n',
                  '    let reservation_ns = if worker.probed && !worker.native.probing {\n'
                  '        PREPAY_NS\n'
                  '    } else {\n'
                  '        PROBE_PREPAY_NS\n'
                  '    };\n'
                  '    if !learning::allow_mandatory(&worker.extra, reservation_ns, ns(timer::ticks())) {\n'
                  '        return;\n'
                  '    }\n'
                  '    let Ok(Some(credit)) = crate::domain_tasks::begin_control(reservation_ns, false) else {\n'
                  '        return;\n'
                  '    };\n',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact match, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          cargo +1.95.0 fmt --all
          rm -f .github/workflows/apply-probe-reservation.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: prepay boot probe under recovery budget"
          git push origin "HEAD:$BRANCH"
