name: V0.13 A01 focused debug

on:
  push:
    branches: [CyxiaOS-V0.13]
    paths:
      - '.github/workflows/v13-a01-debug.yml'
      - 'kernel/src/boot_recovery.rs'
      - 'kernel/src/prototype_runtime/boot_model.rs'
      - 'kernel/src/prototype_storage.rs'
      - 'kernel/src/prototype_storage/boot_diagnostics.rs'
      - 'tools/run_v13_boot*.py'
      - 'tools/verify_v13_boot*.py'
      - 'tools/test_run_v13_boot*.py'
      - 'tools/test_verify_v13_boot*.py'
  workflow_dispatch:

permissions:
  contents: read

# Current-source focused tests only. Engineering validation and the existing
# v13-boot-provenance native workflow remain independent required evidence.
# No old candidate checkout, branch mutation or catalogue promotion occurs.
jobs:
  stopped-failure-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record exact source and exercise failure paths
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a01-focused"
          git rev-parse HEAD > "$RUNNER_TEMP/a01-focused/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/a01-focused/source-tree.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --check
          python3 -B -m unittest discover -s tools -p 'test_run_v13_boot_diagnostics.py' -v 2>&1 | tee "$RUNNER_TEMP/a01-focused/failure-paths.log"
          python3 -B -m unittest discover -s tools -p 'test_verify_v13_boot*.py' -v 2>&1 | tee "$RUNNER_TEMP/a01-focused/boot-provenance.log"
          printf '%s\n' 'Host-only diagnostics/provenance regression; not native A01 acceptance.' > "$RUNNER_TEMP/a01-focused/scope.txt"
      - name: Retain successes and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a01-focused-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/a01-focused/
