name: Materialize per-vCPU accounting patch

on:
  push:
    branches:
      - codex/cyxiaos-v0.1-complete-prototype

permissions:
  contents: write

concurrency:
  group: materialize-pmu-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ startsWith(github.event.head_commit.message, 'materialize per-vcpu accounting patch') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize reviewable text patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip
          from pathlib import Path

          source = Path('.github/codex/patches/110-per-vcpu-accounting-repair.diff.gz')
          target = source.with_suffix('')
          payload = gzip.decompress(source.read_bytes())
          if not payload or b'diff --git ' not in payload:
              raise SystemExit('decompressed payload is not a git patch')
          target.write_bytes(payload)
          print(f'{source}: {source.stat().st_size} bytes')
          print(f'{target}: {target.stat().st_size} bytes')
          PY
      - name: Commit materialized patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/codex/patches/110-per-vcpu-accounting-repair.diff
          git commit -m 'chore: materialize per-vCPU accounting patch'
          git push origin HEAD:codex/cyxiaos-v0.1-complete-prototype
