name: Materialize per-vCPU accounting patch

on:
  push:
    branches:
      - codex/cyxiaos-v0.1-complete-prototype

permissions:
  contents: write

concurrency:
  group: materialize-pmu-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ startsWith(github.event.head_commit.message, 'materialize per-vcpu accounting patch') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Encode staged bytes for deterministic inspection
        run: |
          set -euo pipefail
          source=.github/codex/patches/110-per-vcpu-accounting-repair.diff.gz
          target=.github/codex/patches/110-per-vcpu-accounting-repair.diff.gz.b64
          test -s "$source"
          base64 --wrap=76 "$source" > "$target"
          test -s "$target"
          sha256sum "$source" "$target" > .github/codex/patches/110-per-vcpu-accounting-repair.materialization.sha256
      - name: Commit inspectable bytes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/codex/patches/110-per-vcpu-accounting-repair.diff.gz.b64 \
            .github/codex/patches/110-per-vcpu-accounting-repair.materialization.sha256
          git commit -m 'chore: expose staged PMU patch bytes'
          git push origin HEAD:codex/cyxiaos-v0.1-complete-prototype
