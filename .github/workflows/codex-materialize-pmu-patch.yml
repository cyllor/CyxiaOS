name: Materialize per-vCPU accounting patch

on:
  push:
    branches:
      - codex/cyxiaos-v0.1-complete-prototype

permissions:
  contents: write

concurrency:
  group: materialize-pmu-patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: ${{ startsWith(github.event.head_commit.message, 'materialize per-vcpu accounting patch') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out writable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize payload and diagnostics
        run: |
          set -euo pipefail
          source=.github/codex/patches/110-per-vcpu-accounting-repair.diff.gz
          target=.github/codex/patches/110-per-vcpu-accounting-repair.materialized
          log=.github/codex/patches/110-per-vcpu-accounting-repair.materialization.log
          : > "$log"
          file "$source" >> "$log" 2>&1 || true
          gzip -lv "$source" >> "$log" 2>&1 || true
          status=0
          gzip -dc "$source" > "$target" 2>> "$log" || status=$?
          printf 'gzip_status=%s\n' "$status" >> "$log"
          wc -c "$source" "$target" >> "$log" 2>&1 || true
          sha256sum "$source" "$target" >> "$log" 2>&1 || true
          test -s "$target"
      - name: Commit inspectable payload
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/codex/patches/110-per-vcpu-accounting-repair.materialized \
            .github/codex/patches/110-per-vcpu-accounting-repair.materialization.log
          git commit -m 'chore: materialize staged PMU payload'
          git push origin HEAD:codex/cyxiaos-v0.1-complete-prototype
