name: V0.20.1 kernel algorithm host regression
on:
  push:
    branches: [V0.20.1]
    paths:
      - 'crates/kernel-core/**'
      - 'crates/control-model/**'
      - 'crates/prototype/**'
      - 'crates/driver-virtio/**'
      - 'crates/net-transport/**'
      - 'kernel/**'
      - 'tools/**'
      - 'user/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/v0201-kernel-algorithms.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v0201-kernel-algorithms-${{ github.sha }}
  cancel-in-progress: true
jobs:
  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: cyxia-kernel-core
            seam: 'contig_frames::tests'
          - package: cyxia-kernel-core
            seam: 'console::tests'
          - package: cyxia-kernel-core
            seam: 'frames::tests'
          - package: cyxia-kernel-core
            seam: 'frame_meta_v0199::tests'
          - package: cyxia-kernel-core
            seam: 'd02_owner_v0199::tests'
          - package: cyxia-kernel-core
            seam: 'd07_owner_v0199::tests'
          - package: cyxia-kernel-core
            seam: 'ipc_receive_v3::tests'
          - package: cyxia-kernel-core
            seam: 'file_structure_v1::tests'
          - package: cyxia-kernel-core
            seam: 'd15_owner_v0199::tests'
          - package: cyxia-control-model
            seam: 'native_v0199'
          - package: cyxia-prototype
            seam: 'model::prefix_tests'
          - package: cyxia-prototype
            seam: 'wave4_scheduler_'
          - package: cyxia-prototype
            seam: 'wave4_vm_'
          - package: cyxia-prototype
            seam: 'wave4_io_'
          - package: cyxia-driver-virtio
            seam: 'queue::tests'
          - package: cyxia-net-transport
            seam: 'admission::tests'
            features: tls
          - package: cyxia-kernel-core
            seam: 'snapshot_store_v3::tests'
          - package: cyxia-kernel-core
            seam: 'file_receipt_store_v0199::tests'
          - package: cyxia-prototype
            seam: 'wave5_capability_'
          - package: cyxia-prototype
            seam: 'wave5_network_'
          - package: cyxia-prototype
            seam: 'wave5_irq_'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Run module regression
        env:
          PACKAGE: ${{ matrix.package }}
          SEAM: ${{ matrix.seam }}
          FEATURES: ${{ matrix.features }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$FEATURES" ]; then
            args+=(--features "$FEATURES")
          fi
          cargo +1.95.0 test --locked -p "$PACKAGE" "${args[@]}" "$SEAM" 2>&1 | tee module.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' module.log
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt
      - name: Check format
        run: cargo +1.95.0 fmt --all --check
  integration:
    needs: modules
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Kernel-core suite
        run: cargo +1.95.0 test --locked -p cyxia-kernel-core
      - name: Default workspace regression
        run: cargo +1.95.0 test --locked
  arm-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build AArch64 production skeleton (build evidence only)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --target aarch64-unknown-none-softfloat --target aarch64-unknown-none
          rustup override set 1.95.0
          cargo fetch --locked
          mkdir -p artifacts/v0201-arm
          git rev-parse HEAD > artifacts/v0201-arm/commit.txt
          rustc -vV > artifacts/v0201-arm/toolchain.txt
          python3 -B -c 'import sys; sys.path.insert(0, "tools"); import verify_v0199_sec_n as s; s.build_guest()' 2>&1 | tee artifacts/v0201-arm/build-guest.log
          cargo build --locked --offline -p cyxia-kernel --target aarch64-unknown-none-softfloat --features smp-selftest,v020-production 2>&1 | tee artifacts/v0201-arm/build.log
          cp target/aarch64-unknown-none-softfloat/debug/cyxia-kernel artifacts/v0201-arm/kernel.elf
          readelf -h artifacts/v0201-arm/kernel.elf > artifacts/v0201-arm/elf.txt
          (cd artifacts/v0201-arm && sha256sum kernel.elf > elf.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v0201-arm-build-${{ github.sha }}
          path: artifacts/v0201-arm/
          retention-days: 7
  x86-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build x86-64 platform fixture (build evidence only)
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --target x86_64-unknown-none
          rustup override set 1.95.0
          cargo fetch --locked
          mkdir -p artifacts/v0201-x86
          git rev-parse HEAD > artifacts/v0201-x86/commit.txt
          rustc -vV > artifacts/v0201-x86/toolchain.txt
          python3 -B tools/build.py --output artifacts/v0201-x86/image 2>&1 | tee artifacts/v0201-x86/build.log
          test -s artifacts/v0201-x86/image/kernel.elf
          readelf -h artifacts/v0201-x86/image/kernel.elf > artifacts/v0201-x86/elf.txt
          sha256sum artifacts/v0201-x86/image/kernel.elf > artifacts/v0201-x86/kernel.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v0201-x86-build-${{ github.sha }}
          path: artifacts/v0201-x86/
          retention-days: 7
