name: V0.20.1 kernel algorithm host regression
on:
  push:
    branches: [V0.20.1]
    paths:
      - 'crates/kernel-core/**'
      - 'crates/control-model/**'
      - 'crates/prototype/src/model.rs'
      - '.github/workflows/v0201-kernel-algorithms.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v0201-kernel-algorithms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: cyxia-kernel-core
            seam: 'contig_frames::tests'
          - package: cyxia-kernel-core
            seam: 'console::tests'
          - package: cyxia-kernel-core
            seam: 'frames::tests'
          - package: cyxia-kernel-core
            seam: 'frame_meta_v0199::tests'
          - package: cyxia-kernel-core
            seam: 'd02_owner_v0199::tests'
          - package: cyxia-kernel-core
            seam: 'd07_owner_v0199::tests'
          - package: cyxia-control-model
            seam: 'native_v0199'
          - package: cyxia-prototype
            seam: 'model::prefix_tests'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - name: Run module regression
        env:
          PACKAGE: ${{ matrix.package }}
          SEAM: ${{ matrix.seam }}
        run: cargo +1.95.0 test --locked -p "$PACKAGE" "$SEAM"
  integration:
    needs: modules
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt
      - name: Check format
        run: cargo +1.95.0 fmt --all --check
      - name: Kernel-core suite
        run: cargo +1.95.0 test --locked -p cyxia-kernel-core
      - name: Default workspace regression
        run: cargo +1.95.0 test --locked
