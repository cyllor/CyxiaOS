name: Apply per-vCPU accounting repair

on:
  push:
    branches:
      - codex/cyxiaos-v0.1-complete-prototype

permissions:
  contents: write

concurrency:
  group: complete-prototype-pmu-accounting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: ${{ startsWith(github.event.head_commit.message, 'apply per-vcpu accounting repair') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: tools
    steps:
      - name: Check out writable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update \
            --component rustfmt --component clippy --target aarch64-unknown-none-softfloat
          cargo fetch --locked
      - name: Apply and format per-vCPU accounting repair
        run: |
          set -euo pipefail
          main_patch="$RUNNER_TEMP/110-per-vcpu-accounting-repair.diff"
          gzip -dc .github/codex/patches/110-per-vcpu-accounting-repair.diff.gz > "$main_patch"
          # These two files were reformatted by the previous validated repair.
          # Apply the semantic patch to every other file, then use a small patch
          # rebased on the exact current branch head for these contexts.
          excludes=(
            --exclude=crates/cluster-transport/tests/network.rs
            --exclude=kernel/src/unified.rs
          )
          git apply --check "${excludes[@]}" "$main_patch"
          git apply "${excludes[@]}" "$main_patch"
          git apply --check .github/codex/patches/111-rebased-conflicts.diff
          git apply .github/codex/patches/111-rebased-conflicts.diff
          cargo fmt --all
          git diff --check
      - name: Run focused correctness gates
        run: |
          python3 -B -m unittest -v test_verify_domains
          cargo test --locked --offline -p cyxia-cluster-transport --test network
          cargo test --locked --offline -p cyxia-prototype --test domain_tasks
          cargo test --locked --offline -p cyxia-prototype --test native_service_authority
          cargo clippy --locked --offline -p cyxia-kernel \
            --target aarch64-unknown-none-softfloat --features smp-selftest -- -D warnings
      - name: Commit validated formatted source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): separate per-vCPU execution accounting'
          git push origin HEAD:codex/cyxiaos-v0.1-complete-prototype
