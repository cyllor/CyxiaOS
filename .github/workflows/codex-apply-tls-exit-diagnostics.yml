name: Apply and validate TLS exit diagnostics

on:
  push:
    branches:
      - codex/v011-tls-exit-diagnostics
    paths:
      - '.github/codex/patches/tls-exit-diagnostics.patch.gz.b64'
      - '.github/workflows/codex-apply-tls-exit-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tls-exit-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply staged patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/codex/patches/tls-exit-diagnostics.patch.gz.b64
          patch="$RUNNER_TEMP/tls-exit-diagnostics.patch"
          if [ ! -f "$payload" ]; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base64 --decode "$payload" | gzip --decompress > "$patch"
          git apply --check "$patch"
          git apply "$patch"
          echo 'apply=true' >> "$GITHUB_OUTPUT"
      - name: Run focused safety checks
        if: steps.patch.outputs.apply == 'true'
        run: python3 -B -m unittest tests.host.test_service_tls_exit_diagnostics -v
      - name: Install pinned Rust toolchain
        if: steps.patch.outputs.apply == 'true'
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update \
            --component rustfmt --component clippy --component llvm-tools-preview \
            --target aarch64-unknown-none --target aarch64-unknown-none-softfloat
          cargo fetch --locked
          cargo fetch --locked --manifest-path user/prototype-cluster/Cargo.toml
      - name: Check formatting
        if: steps.patch.outputs.apply == 'true'
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path user/prototype-cluster/Cargo.toml -- --check
      - name: Run cluster host tests and Clippy
        if: steps.patch.outputs.apply == 'true'
        run: |
          cargo test --locked --offline --manifest-path user/prototype-cluster/Cargo.toml
          cargo clippy --locked --offline --manifest-path user/prototype-cluster/Cargo.toml \
            --all-targets -- -D warnings
      - name: Check exact service-fault guest image
        if: steps.patch.outputs.apply == 'true'
        run: |
          set -euo pipefail
          python3 user/prototype-cluster/tools/provision.py "$RUNNER_TEMP/pair"
          CYXIA_CLUSTER_IDENTITY="$RUNNER_TEMP/pair/a" \
          CYXIA_CLUSTER_FAULT=after-ready \
          cargo clippy --locked --offline \
            --manifest-path user/prototype-cluster/Cargo.toml \
            --features guest --bin cyxia-prototype-cluster \
            --target aarch64-unknown-none -- -D warnings
      - name: Commit validated source
        if: steps.patch.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/codex/patches/tls-exit-diagnostics.patch.gz.b64 \
            .github/workflows/codex-apply-tls-exit-diagnostics.yml
          git config user.name 'cyllor'
          git config user.email '45630989+cyllor@users.noreply.github.com'
          git add user/prototype-cluster/src/broker.rs \
            user/prototype-cluster/src/lib.rs \
            user/prototype-cluster/src/runtime.rs \
            user/prototype-cluster/src/session_exit.rs \
            tests/host/test_service_tls_exit_diagnostics.py
          git commit -m 'test(cluster): record bounded TLS session exits'
          git push origin HEAD:codex/v011-tls-exit-diagnostics
