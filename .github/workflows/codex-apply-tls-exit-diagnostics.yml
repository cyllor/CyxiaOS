name: Apply and validate TLS exit diagnostics

on:
  push:
    branches:
      - codex/v011-tls-exit-diagnostics
    paths:
      - '.github/codex/patches/tls-exit-diagnostics.part-*'
      - '.github/workflows/codex-apply-tls-exit-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tls-exit-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Reassemble and apply staged patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/tls-exit-diagnostics.patch.gz.b64"
          patch="$RUNNER_TEMP/tls-exit-diagnostics.patch"
          parts=(.github/codex/patches/tls-exit-diagnostics.part-{00..08})
          for part in "${parts[@]}"; do test -s "$part"; done
          cat "${parts[@]}" > "$payload"
          test "$(wc -c < "$payload")" = 2912
          printf '%s  %s\n' \
            ab105948ebc775ea371d011a22fa1c7774b3b21b10e5ad760d7fc4b8e8a7872b \
            "$payload" | sha256sum --check --strict -
          base64 --decode "$payload" | gzip --decompress > "$patch"
          printf '%s  %s\n' \
            49c3a3d6bd39cd3a2a76cabcc775ff3b496f13cf8f385a771b27b0d1bc8b9496 \
            "$patch" | sha256sum --check --strict -
          git apply --check "$patch"
          git apply "$patch"
          cat > user/prototype-cluster/src/session_exit.rs <<'EOF'
          //! Bounded, non-authoritative TLS session-exit diagnostics. These codes explain
          //! why the EL0 service left one session; they never grant identity or recovery.
          #[derive(Clone, Copy, Debug, PartialEq, Eq)]
          #[repr(u16)]
          pub enum SessionExitReason {
              ConnectionLost = 1,
              ClockUnavailable = 2,
              DomainTick = 3,
              TcpRead = 4,
              TlsReceive = 5,
              TlsPump = 6,
              HandshakeTicket = 7,
              HandshakeFinish = 8,
              EnterAuthenticated = 9,
              PlaintextIngest = 10,
              PlaintextConsume = 11,
              DriverTick = 12,
              ReplayReconnect = 13,
              TlsEgress = 14,
          }

          impl SessionExitReason {
              pub const EVENT_BASE: u64 = 0x230;

              pub const fn trace_event(self) -> u64 {
                  Self::EVENT_BASE + self as u64
              }
          }

          #[cfg(test)]
          mod tests {
              use super::SessionExitReason;

              #[test]
              fn exit_events_are_stable_unique_and_nonfatal() {
                  let reasons = [
                      SessionExitReason::ConnectionLost,
                      SessionExitReason::ClockUnavailable,
                      SessionExitReason::DomainTick,
                      SessionExitReason::TcpRead,
                      SessionExitReason::TlsReceive,
                      SessionExitReason::TlsPump,
                      SessionExitReason::HandshakeTicket,
                      SessionExitReason::HandshakeFinish,
                      SessionExitReason::EnterAuthenticated,
                      SessionExitReason::PlaintextIngest,
                      SessionExitReason::PlaintextConsume,
                      SessionExitReason::DriverTick,
                      SessionExitReason::ReplayReconnect,
                      SessionExitReason::TlsEgress,
                  ];
                  for (index, reason) in reasons.into_iter().enumerate() {
                      assert_eq!(reason.trace_event(), 0x231 + index as u64);
                      assert!(!(0xfe..=0x108).contains(&reason.trace_event()));
                      assert!(reason.trace_event() < 0xf000);
                  }
              }
          }
          EOF
          echo 'apply=true' >> "$GITHUB_OUTPUT"
      - name: Run focused safety checks
        if: steps.patch.outputs.apply == 'true'
        run: python3 -B -m unittest tests.host.test_service_tls_exit_diagnostics -v
      - name: Install pinned Rust toolchain
        if: steps.patch.outputs.apply == 'true'
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update \
            --component rustfmt --component clippy --component llvm-tools-preview \
            --target aarch64-unknown-none --target aarch64-unknown-none-softfloat
          cargo fetch --locked
          cargo fetch --locked --manifest-path user/prototype-cluster/Cargo.toml
      - name: Format and verify source
        if: steps.patch.outputs.apply == 'true'
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --manifest-path user/prototype-cluster/Cargo.toml
          cargo fmt --all -- --check
          cargo fmt --manifest-path user/prototype-cluster/Cargo.toml -- --check
          git diff --check
      - name: Run cluster host tests and library Clippy
        if: steps.patch.outputs.apply == 'true'
        run: |
          cargo test --locked --offline --manifest-path user/prototype-cluster/Cargo.toml
          cargo clippy --locked --offline --manifest-path user/prototype-cluster/Cargo.toml \
            --lib -- -D warnings
      - name: Check exact service-fault guest image
        if: steps.patch.outputs.apply == 'true'
        run: |
          set -euo pipefail
          python3 user/prototype-cluster/tools/provision.py "$RUNNER_TEMP/pair"
          CYXIA_CLUSTER_IDENTITY="$RUNNER_TEMP/pair/a" \
          CYXIA_CLUSTER_FAULT=after-ready \
          cargo clippy --locked --offline \
            --manifest-path user/prototype-cluster/Cargo.toml \
            --features guest --bin cyxia-prototype-cluster \
            --target aarch64-unknown-none -- \
            -D warnings -A dead_code -A clippy::collapsible_if
      - name: Commit validated source
        if: steps.patch.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/codex/patches/tls-exit-diagnostics.patch.gz.b64 \
            .github/codex/patches/tls-exit-diagnostics.part-* \
            .github/workflows/codex-apply-tls-exit-diagnostics.yml \
            .github/workflows/codex-debug-tls-guest.yml
          git config user.name 'cyllor'
          git config user.email '45630989+cyllor@users.noreply.github.com'
          git add user/prototype-cluster/src/broker.rs \
            user/prototype-cluster/src/lib.rs \
            user/prototype-cluster/src/runtime.rs \
            user/prototype-cluster/src/session_exit.rs \
            tests/host/test_service_tls_exit_diagnostics.py
          git commit -m 'test(cluster): record bounded TLS session exits'
          git push origin HEAD:codex/v011-tls-exit-diagnostics
