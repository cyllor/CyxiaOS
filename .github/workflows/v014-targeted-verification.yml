name: V0.14 targeted debug verification
on:
  push:
    branches:
      - debug/v0.14-runtime-loop-verifier
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run source-bound regression
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tools -p 'test_decode_runtime_loop.py' -v
          git diff --exit-code
      - name: Record exact source identity
        if: always()
        run: git rev-parse HEAD
