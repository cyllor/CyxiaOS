name: Apply and validate D04 dependency snapshot

on:
  push:
    branches:
      - codex/v011-d04-dependency-snapshot
    paths:
      - '.github/codex/patches/d04-dependency-snapshot.patch.gz.b64'
      - '.github/workflows/codex-apply-d04-dependency-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: d04-dependency-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply staged patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/codex/patches/d04-dependency-snapshot.patch.gz.b64
          patch="$RUNNER_TEMP/d04-dependency-snapshot.patch"
          if [ ! -f "$payload" ]; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base64 --decode "$payload" | gzip --decompress > "$patch"
          git apply --check "$patch"
          git apply "$patch"
          echo 'apply=true' >> "$GITHUB_OUTPUT"
      - name: Run focused projection regression
        if: steps.patch.outputs.apply == 'true'
        run: python3 -B -m unittest tests.host.test_v13_dependency_projection -v
      - name: Install pinned Rust toolchain
        if: steps.patch.outputs.apply == 'true'
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update \
            --component rustfmt --component clippy --component llvm-tools-preview \
            --target aarch64-unknown-none --target aarch64-unknown-none-softfloat
          cargo fetch --locked
      - name: Check formatting
        if: steps.patch.outputs.apply == 'true'
        run: cargo fmt --all -- --check
      - name: Run configured native Clippy gate
        if: steps.patch.outputs.apply == 'true'
        run: |
          cargo clippy --locked --offline -p cyxia-kernel \
            --target aarch64-unknown-none-softfloat \
            --features smp-selftest -- -D warnings
      - name: Run non-kernel Rust workspace tests
        if: steps.patch.outputs.apply == 'true'
        run: cargo test --locked --offline --workspace --exclude cyxia-kernel
      - name: Prepare pinned host fixtures
        if: steps.patch.outputs.apply == 'true'
        run: python3 -B tools/prepare_host_tests.py --fetch
      - name: Run host Python tests
        if: steps.patch.outputs.apply == 'true'
        run: python3 -B -m unittest discover -s tests/host -p 'test_*.py' -v
      - name: Run evidence tool tests
        if: steps.patch.outputs.apply == 'true'
        run: python3 -B -m unittest discover -s tools -p 'test_*.py' -v
      - name: Commit validated source
        if: steps.patch.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/codex/patches/d04-dependency-snapshot.patch \
            .github/codex/patches/d04-dependency-snapshot.patch.gz.b64
          git config user.name 'cyllor'
          git config user.email '45630989+cyllor@users.noreply.github.com'
          git add kernel/src/domain_control.rs kernel/src/domain_storage.rs \
            kernel/src/domain_tasks.rs kernel/src/prototype_storage.rs \
            tests/host/test_v13_dependency_projection.py
          git commit -m 'perf(control): collapse D04 dependency snapshots'
          git push origin HEAD:codex/v011-d04-dependency-snapshot
