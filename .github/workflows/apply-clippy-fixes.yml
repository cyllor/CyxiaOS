name: Apply pinned clippy repair

on:
  push:
    branches:
      - fix/first-level-subsystems-20261024
    paths:
      - '.github/workflows/apply-clippy-fixes.yml'
      - '.ci/clippy-patch.*'

permissions:
  contents: write

concurrency:
  group: apply-clippy-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/first-level-subsystems-20261024
          fetch-depth: 0
      - name: Install pinned formatter
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt
      - name: Apply, format, and commit repair
        env:
          BRANCH: fix/first-level-subsystems-20261024
        run: |
          set -euo pipefail
          cat .ci/clippy-patch.* | base64 --decode > "$RUNNER_TEMP/clippy-fixes.patch"
          git apply --check "$RUNNER_TEMP/clippy-fixes.patch"
          git apply "$RUNNER_TEMP/clippy-fixes.patch"
          cargo +1.95.0 fmt --all
          rm -f .ci/clippy-patch.* .github/workflows/apply-clippy-fixes.yml
          rmdir .ci 2>/dev/null || true
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: satisfy pinned Rust 1.95 clippy gate"
          git push origin "HEAD:$BRANCH"
