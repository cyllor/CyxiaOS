name: Codex source snapshot

on:
  push:
    branches:
      - codex/cyxiaos-v0.1-complete-prototype

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Pack source tree
        run: tar --exclude=.git -czf "$RUNNER_TEMP/cyxiaos-source.tgz" .
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: cyxiaos-source
          path: ${{ runner.temp }}/cyxiaos-source.tgz
          if-no-files-found: error
          retention-days: 1
