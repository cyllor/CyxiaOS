name: Codex v0.1 control preparation patch

on:
  push:
    branches:
      - codex/cyxiaos-v0.1-complete-prototype

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.head_commit.message == 'chore: stage v0.1 control preparation validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt --component clippy --target aarch64-unknown-none-softfloat
          cargo fetch --locked
      - name: Apply bounded preparation patches
        run: |
          set -euo pipefail
          for patch in .github/codex/patches/*.diff; do
            git apply --check "$patch"
            git apply "$patch"
          done
          cargo fmt --all
      - name: Run focused Rust tests
        run: |
          cargo test --locked --offline -p cyxia-prototype \
            --test native_target_batch \
            --test native_preparation_debit \
            --test domain_policy \
            --test native_core_replay
      - name: Run kernel clippy gate
        run: cargo clippy --locked --offline -p cyxia-kernel --target aarch64-unknown-none-softfloat --features smp-selftest -- -D warnings
      - name: Run related host integrity gates
        run: python3 -B -m unittest -v tests.host.test_preparation_stack_gate tests.host.test_prototype_evidence
      - name: Commit validated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kernel/src/domain_control.rs \
            kernel/src/domain_control/core_replay.rs \
            kernel/src/domain_control/target_batch.rs \
            crates/prototype/src/policy.rs \
            crates/prototype/tests/domain_policy.rs \
            crates/prototype/tests/native_preparation_debit.rs \
            crates/prototype/tests/native_target_batch.rs
          git commit -m 'perf(control): bound native candidate preparation'
          git push origin HEAD:codex/cyxiaos-v0.1-complete-prototype
