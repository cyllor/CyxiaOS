name: Validate complete prototype branch

on:
  push:
    branches:
      - codex/cyxiaos-v0.1-complete-prototype
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: complete-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ !startsWith(github.event.head_commit.message, 'diagnostic:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt --component clippy --target aarch64-unknown-none-softfloat
          cargo fetch --locked
      - name: Check formatting and native clippy gate
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --offline -p cyxia-kernel --target aarch64-unknown-none-softfloat --features smp-selftest -- -D warnings
      - name: Run Rust workspace tests
        run: cargo test --locked --offline --workspace --exclude cyxia-kernel
      - name: Prepare pinned host test inputs
        run: python3 -B tools/prepare_host_tests.py --fetch
      - name: Run host Python tests
        run: python3 -B -m unittest discover -s tests/host -p 'test_*.py' -v
      - name: Run native evidence tool tests
        run: python3 -B -m unittest discover -s tools -p 'test_*.py' -v
      - name: Capture exact source and validation metadata
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/validate-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/validate-evidence/source-commit.txt"
          rustc -vV > "$RUNNER_TEMP/validate-evidence/rust-version.txt"
          git status --short > "$RUNNER_TEMP/validate-evidence/git-status.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/validate-evidence/CyxiaOS-source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/validate-evidence/CyxiaOS-source.tar.gz" > "$RUNNER_TEMP/validate-evidence/CyxiaOS-source.tar.gz.sha256"
      - name: Retain exact validation source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete-prototype-validation-${{ github.sha }}
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
          path: ${{ runner.temp }}/validate-evidence/

  native-replay:
    if: ${{ !startsWith(github.event.head_commit.message, 'diagnostic:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned native toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt --component clippy --component llvm-tools-preview --target aarch64-unknown-none --target aarch64-unknown-none-softfloat
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang make pkg-config libglib2.0-dev libpixman-1-dev libfdt-dev ninja-build python3-venv
          cargo fetch --locked
          mkdir -p "$RUNNER_TEMP/native-replay-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/native-replay-evidence/source-commit.txt"
          rustc -vV > "$RUNNER_TEMP/native-replay-evidence/rust-version.txt"
      - name: Build exact patched QEMU 10.2.2
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/qemu/qemu.git "$RUNNER_TEMP/qemu"
          git -C "$RUNNER_TEMP/qemu" checkout --detach f8ed81651e61d9c2166df6121ce2af0f44f06b3e
          test "$(git -C "$RUNNER_TEMP/qemu" rev-parse HEAD)" = f8ed81651e61d9c2166df6121ce2af0f44f06b3e
          git -C "$RUNNER_TEMP/qemu" apply --check "$GITHUB_WORKSPACE/tools/qemu/cyxia-per-vcpu-pmu.patch"
          git -C "$RUNNER_TEMP/qemu" apply "$GITHUB_WORKSPACE/tools/qemu/cyxia-per-vcpu-pmu.patch"
          git -C "$RUNNER_TEMP/qemu" diff --check
          cd "$RUNNER_TEMP/qemu"
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-opengl \
            --disable-werror
          ninja -C build qemu-system-aarch64
          mkdir -p "$RUNNER_TEMP/qemu-tools/bin"
          install -m 0755 build/qemu-system-aarch64 "$RUNNER_TEMP/qemu-tools/bin/qemu-system-aarch64"
          echo "$RUNNER_TEMP/qemu-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/qemu-tools/bin/qemu-system-aarch64" --version | tee "$RUNNER_TEMP/native-replay-evidence/qemu-version.txt"
          sha256sum "$GITHUB_WORKSPACE/tools/qemu/cyxia-per-vcpu-pmu.patch" > "$RUNNER_TEMP/native-replay-evidence/qemu-patch.sha256"
          sha256sum "$RUNNER_TEMP/qemu-tools/bin/qemu-system-aarch64" > "$RUNNER_TEMP/native-replay-evidence/qemu-system-aarch64.sha256"
      - name: Build exact native pair and replay tools
        run: |
          set -o pipefail
          retain_unified_logs() {
            mkdir -p "$RUNNER_TEMP/native-replay-evidence/unified-build"
            if [ -d "$RUNNER_TEMP/unified-build" ]; then
              find "$RUNNER_TEMP/unified-build" -maxdepth 1 -type f \
                \( -name '*.log' -o -name '*-stack.json' -o -name 'build-manifest.json' \) \
                -exec cp -f {} "$RUNNER_TEMP/native-replay-evidence/unified-build/" \;
            fi
          }
          trap retain_unified_logs EXIT
          python3 user/prototype-cluster/tools/provision.py "$RUNNER_TEMP/pair" 2>&1 | tee "$RUNNER_TEMP/native-replay-evidence/provision.log"
          cargo build --locked --offline -p cyxia-prototype --example prototype-disk --example verify-domain-evidence 2>&1 | tee "$RUNNER_TEMP/native-replay-evidence/replay-tools-build.log"
          python3 tools/build_unified.py --identity-a "$RUNNER_TEMP/pair/a" --identity-b "$RUNNER_TEMP/pair/b" --output "$RUNNER_TEMP/unified-build" --selftest 2>&1 | tee "$RUNNER_TEMP/native-replay-evidence/unified-build.log"
      - name: Recompute both native preparation stack paths
        run: |
          set -euo pipefail
          for node in a b; do
            python3 tools/check_v13_preparation_stack.py \
              "$RUNNER_TEMP/unified-build/node-$node.elf" \
              > "$RUNNER_TEMP/native-replay-evidence/ci-node-$node-stack.json"
          done
      - name: Run first protected native replay pair
        run: |
          set -o pipefail
          python3 tools/verify_domains.py \
            --elf "$RUNNER_TEMP/unified-build/node-a.elf" \
            --peer-elf "$RUNNER_TEMP/unified-build/node-b.elf" \
            --build-manifest "$RUNNER_TEMP/unified-build/build-manifest.json" \
            --source-root . \
            --qemu "$RUNNER_TEMP/qemu-tools/bin/qemu-system-aarch64" \
            --output "$RUNNER_TEMP/native-replay-evidence/run" \
            --timeout 600 --hold 1 --sample-ms 250 --clock-profile wallclock \
            --replay-pairs 1 2>&1 | tee "$RUNNER_TEMP/native-replay-evidence/native-replay.log"
      - name: Retain raw native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete-prototype-native-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/native-replay-evidence/

  tcg-wallclock-diagnostic:
    if: ${{ startsWith(github.event.head_commit.message, 'diagnostic:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned native toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --component llvm-tools-preview --target aarch64-unknown-none --target aarch64-unknown-none-softfloat
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang make pkg-config libglib2.0-dev libpixman-1-dev libfdt-dev ninja-build python3-venv
          cargo fetch --locked
          mkdir -p "$RUNNER_TEMP/tcg-diagnostic"
          git rev-parse HEAD > "$RUNNER_TEMP/tcg-diagnostic/source-commit.txt"
          rustc -vV > "$RUNNER_TEMP/tcg-diagnostic/rust-version.txt"
      - name: Build exact patched QEMU 10.2.2
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/qemu/qemu.git "$RUNNER_TEMP/qemu"
          git -C "$RUNNER_TEMP/qemu" checkout --detach f8ed81651e61d9c2166df6121ce2af0f44f06b3e
          test "$(git -C "$RUNNER_TEMP/qemu" rev-parse HEAD)" = f8ed81651e61d9c2166df6121ce2af0f44f06b3e
          git -C "$RUNNER_TEMP/qemu" apply --check "$GITHUB_WORKSPACE/tools/qemu/cyxia-per-vcpu-pmu.patch"
          git -C "$RUNNER_TEMP/qemu" apply "$GITHUB_WORKSPACE/tools/qemu/cyxia-per-vcpu-pmu.patch"
          git -C "$RUNNER_TEMP/qemu" diff --check
          cd "$RUNNER_TEMP/qemu"
          ./configure \
            --target-list=aarch64-softmmu \
            --disable-docs \
            --disable-gtk \
            --disable-sdl \
            --disable-opengl \
            --disable-werror
          ninja -C build qemu-system-aarch64
          mkdir -p "$RUNNER_TEMP/qemu-tools/bin"
          install -m 0755 build/qemu-system-aarch64 "$RUNNER_TEMP/qemu-tools/bin/qemu-system-aarch64"
          "$RUNNER_TEMP/qemu-tools/bin/qemu-system-aarch64" --version | tee "$RUNNER_TEMP/tcg-diagnostic/qemu-version.txt"
          sha256sum "$GITHUB_WORKSPACE/tools/qemu/cyxia-per-vcpu-pmu.patch" > "$RUNNER_TEMP/tcg-diagnostic/qemu-patch.sha256"
          sha256sum "$RUNNER_TEMP/qemu-tools/bin/qemu-system-aarch64" > "$RUNNER_TEMP/tcg-diagnostic/qemu-system-aarch64.sha256"
      - name: Build one exact native pair
        run: |
          set -euo pipefail
          python3 user/prototype-cluster/tools/provision.py "$RUNNER_TEMP/pair" > "$RUNNER_TEMP/tcg-diagnostic/provision.log" 2>&1
          cargo build --locked --offline -p cyxia-prototype --example prototype-disk --example verify-domain-evidence > "$RUNNER_TEMP/tcg-diagnostic/replay-tools-build.log" 2>&1
          python3 tools/build_unified.py \
            --identity-a "$RUNNER_TEMP/pair/a" \
            --identity-b "$RUNNER_TEMP/pair/b" \
            --output "$RUNNER_TEMP/unified-build" \
            --selftest > "$RUNNER_TEMP/tcg-diagnostic/unified-build.log" 2>&1
          cp "$RUNNER_TEMP/unified-build/node-a-stack.json" "$RUNNER_TEMP/tcg-diagnostic/"
          cp "$RUNNER_TEMP/unified-build/node-b-stack.json" "$RUNNER_TEMP/tcg-diagnostic/"
      - name: Compare single and multi TCG wallclock accounting
        run: |
          set -uo pipefail
          for mode in single multi; do
            out="$RUNNER_TEMP/tcg-diagnostic/$mode"
            log="$RUNNER_TEMP/tcg-diagnostic/$mode.log"
            status=0
            python3 tools/verify_domains.py \
              --elf "$RUNNER_TEMP/unified-build/node-a.elf" \
              --peer-elf "$RUNNER_TEMP/unified-build/node-b.elf" \
              --build-manifest "$RUNNER_TEMP/unified-build/build-manifest.json" \
              --source-root . \
              --qemu "$RUNNER_TEMP/qemu-tools/bin/qemu-system-aarch64" \
              --output "$out" \
              --timeout 240 --hold 1 --sample-ms 250 \
              --clock-profile wallclock --tcg-threads "$mode" \
              --replay-pairs 1 2>&1 | tee "$log" || status=${PIPESTATUS[0]}
            printf '%s\n' "$status" > "$RUNNER_TEMP/tcg-diagnostic/$mode.status"
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'tcg-diagnostic'
          summary = {}
          for mode in ('single', 'multi'):
              result = root / mode / 'result.json'
              status_file = root / f'{mode}.status'
              item = {'exit_status': int(status_file.read_text().strip())}
              if result.exists():
                  payload = json.loads(result.read_text())
                  item.update({key: payload.get(key) for key in ('status', 'scope', 'error', 'wall_seconds')})
              summary[mode] = item
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Remove large mutable disk images
        if: always()
        run: |
          find "$RUNNER_TEMP/tcg-diagnostic" -type f \
            \( -name 'disk.raw' -o -name '*.img' -o -size +32M \) -delete || true
          du -ah "$RUNNER_TEMP/tcg-diagnostic" | sort -h | tail -40
      - name: Retain compact TCG comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcg-wallclock-diagnostic-${{ github.sha }}
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
          path: ${{ runner.temp }}/tcg-diagnostic/
