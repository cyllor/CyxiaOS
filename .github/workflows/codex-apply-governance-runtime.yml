name: Apply governance runtime

on:
  push:
    branches:
      - codex/cyxiaos-v0.11-complete-prototype

permissions:
  contents: write

concurrency:
  group: apply-governance-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ startsWith(github.event.head_commit.message, 'apply governance runtime patch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: tools
    steps:
      - name: Check out writable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned native toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update \
            --component rustfmt --component clippy --component llvm-tools-preview \
            --target aarch64-unknown-none --target aarch64-unknown-none-softfloat
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang make python3-venv
          cargo fetch --locked
      - name: Apply exact governance runtime patch
        run: |
          set -euo pipefail
          patch=.github/codex/patches/130-governance-runtime.diff.gz
          echo '457fc1230f6157dd06bfad9012aff2bb08c93f3f974adee28807c8dd966fe760  '"$patch" | sha256sum -c -
          gzip -dc "$patch" > "$RUNNER_TEMP/governance-runtime.diff"
          git apply --check "$RUNNER_TEMP/governance-runtime.diff"
          git apply "$RUNNER_TEMP/governance-runtime.diff"
          cargo fmt --all
          cargo fmt --manifest-path user/prototype-governance/Cargo.toml
          git diff --check
      - name: Run governance evidence tests
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tools.test_verify_domains
      - name: Build exact unified runtime pair
        run: |
          set -euo pipefail
          python3 user/prototype-cluster/tools/provision.py "$RUNNER_TEMP/pair"
          python3 tools/build_unified.py \
            --identity-a "$RUNNER_TEMP/pair/a" \
            --identity-b "$RUNNER_TEMP/pair/b" \
            --output "$RUNNER_TEMP/unified-build" \
            --selftest
          test -s "$RUNNER_TEMP/unified-build/node-a.elf"
          test -s "$RUNNER_TEMP/unified-build/node-b.elf"
          test -s "$RUNNER_TEMP/unified-build/governance.elf"
          python3 tools/check_v13_preparation_stack.py "$RUNNER_TEMP/unified-build/node-a.elf" > "$RUNNER_TEMP/node-a-stack.json"
          python3 tools/check_v13_preparation_stack.py "$RUNNER_TEMP/unified-build/node-b.elf" > "$RUNNER_TEMP/node-b-stack.json"
      - name: Run non-kernel workspace tests
        run: |
          set -euo pipefail
          cargo test --locked --offline --workspace --exclude cyxia-kernel
      - name: Commit validated source only
        run: |
          set -euo pipefail
          git rm \
            .github/codex/patches/130-governance-runtime.diff.gz \
            .github/workflows/codex-apply-governance-runtime.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(governance): execute and authenticate EL0 coordinator'
          git push origin HEAD:codex/cyxiaos-v0.11-complete-prototype
