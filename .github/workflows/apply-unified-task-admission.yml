name: Apply unified task admission migration

on:
  push:
    branches:
      - fix/first-level-subsystems-20261024
    paths:
      - '.github/workflows/apply-unified-task-admission.yml'

permissions:
  contents: write

concurrency:
  group: apply-unified-task-admission
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/first-level-subsystems-20261024
          fetch-depth: 0
      - name: Install pinned formatter
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt
      - name: Migrate final start admission and self-remove
        env:
          BRANCH: fix/first-level-subsystems-20261024
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kernel/src/unified_task.rs')
          source = path.read_text()
          old_import = 'use cyxia_kernel_core::control_plane::task_admission::{Authority, Terms, expire_quiescent};'
          new_import = '''use cyxia_kernel_core::control_plane::task_admission::{
              Authority, StartRequest, Terms, expire_quiescent,
          };'''
          if source.count(old_import) != 1:
              raise SystemExit('unexpected unified task admission import')
          source = source.replace(old_import, new_import)
          old_parse = '''            let grant = u64::from_le_bytes(payload[24..32].try_into().unwrap());
                      let contract = payload[32..48].try_into().unwrap();
                      let digest = unsafe {
                          Sha256::digest(core::slice::from_raw_parts(
                              core::ptr::addr_of!(INPUT).cast::<u8>(),
                              input as usize,
                          ))
                          .into()
                      };
          '''
          new_parse = '''            let grant = u64::from_le_bytes(payload[24..32].try_into().unwrap());
                      let contract: [u8; 16] = payload[32..48].try_into().unwrap();
                      let digest = unsafe {
                          Sha256::digest(core::slice::from_raw_parts(
                              core::ptr::addr_of!(INPUT).cast::<u8>(),
                              input as usize,
                          ))
                          .into()
                      };
                      let start = StartRequest {
                          token,
                          contract,
                          grant,
                          deadline: end,
                          session: bound,
                          input_hash: digest,
                      };
          '''
          if source.count(old_parse) != 1:
              raise SystemExit('unexpected unified task start payload decoder')
          source = source.replace(old_parse, new_parse)
          old_start = '''            if unsafe {
                          (&mut *core::ptr::addr_of_mut!(AUTHORITY)).start(
                              token,
                              contract,
                              grant,
                              end,
                              bound,
                              digest,
                              timer::ticks() / (timer::frequency() / 1000),
                          )
                      }
          '''
          new_start = '''            if unsafe { (&mut *core::ptr::addr_of_mut!(AUTHORITY)).start(start, now) }
          '''
          if source.count(old_start) != 1:
              raise SystemExit('unexpected legacy unified task start call')
          path.write_text(source.replace(old_start, new_start))
          PY
          cargo +1.95.0 fmt --all
          rm -f .github/workflows/apply-unified-task-admission.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: bind unified task start through StartRequest"
          git push origin "HEAD:$BRANCH"
