name: Apply sliced learning selftest

on:
  push:
    branches:
      - codex/cyxiaos-v0.11-complete-prototype

permissions:
  contents: write

concurrency:
  group: apply-learning-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ startsWith(github.event.head_commit.message, 'apply sliced learning selftest patch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out writable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned native toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --no-self-update \
            --component rustfmt --component clippy --component llvm-tools-preview \
            --target aarch64-unknown-none --target aarch64-unknown-none-softfloat
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang make python3-venv
          cargo fetch --locked
      - name: Apply exact selftest slicing patch
        run: |
          set -euo pipefail
          patch=.github/codex/patches/140-learning-selftest-slices.diff.gz
          echo '467c1be00e79a5b9ba02375b18344b65818c793233c68abe049c89c0983c760e  '"$patch" | sha256sum -c -
          gzip -dc "$patch" > "$RUNNER_TEMP/learning-selftest-slices.diff"
          git apply --check "$RUNNER_TEMP/learning-selftest-slices.diff"
          git apply "$RUNNER_TEMP/learning-selftest-slices.diff"
          cargo fmt --all
          cargo fmt --manifest-path user/prototype-learning/Cargo.toml
          git diff --check
      - name: Run exact learning tests
        run: |
          set -euo pipefail
          cargo test --locked --offline -p cyxia-prototype \
            --test learning_worker --test learning_validation
          cargo clippy --locked --offline -p cyxia-prototype --all-targets -- -D warnings
      - name: Build exact unified pair
        run: |
          set -euo pipefail
          python3 user/prototype-cluster/tools/provision.py "$RUNNER_TEMP/pair"
          python3 tools/build_unified.py \
            --identity-a "$RUNNER_TEMP/pair/a" \
            --identity-b "$RUNNER_TEMP/pair/b" \
            --output "$RUNNER_TEMP/unified-build" --selftest
          test -s "$RUNNER_TEMP/unified-build/node-a.elf"
          test -s "$RUNNER_TEMP/unified-build/node-b.elf"
          test -s "$RUNNER_TEMP/unified-build/learning.elf"
          test -s "$RUNNER_TEMP/unified-build/governance.elf"
      - name: Commit validated source only
        run: |
          set -euo pipefail
          git rm \
            .github/codex/patches/140-learning-selftest-slices.diff.gz \
            .github/workflows/codex-apply-learning-selftest-slices.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(learning): yield after every operator golden case'
          git push origin HEAD:codex/cyxiaos-v0.11-complete-prototype
