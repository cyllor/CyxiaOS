name: V0.20 protected control gate components
on:
  pull_request:
    branches: [CyxiaOS-V0.20]
    paths:
      - 'crates/kernel-core/src/control_plane/**'
      - 'crates/kernel-core/src/security/**'
      - 'crates/control-model/**'
      - 'kernel/src/arch/aarch64/v0199_control_bringup.rs'
      - '.github/workflows/v20-protected-control-gates.yml'
      - 'tools/verify_v0199_verdicts.py'
      - 'tools/test_verify_v0199_verdicts.py'
      - 'tools/v0199-required-proof-inventory.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify complete control-plane component regressions
        run: |
          set -euo pipefail
          mkdir -p artifacts/control-gates
          git rev-parse HEAD > artifacts/control-gates/commit.txt
          git rev-parse HEAD^{tree} > artifacts/control-gates/tree.txt
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup override set 1.95.0
          cargo fetch --locked
          cargo test --locked --offline -p cyxia-kernel-core --lib control_plane 2>&1 | tee artifacts/control-gates/control-plane.log
          cargo test --locked --offline -p cyxia-control-model native_v0199 2>&1 | tee artifacts/control-gates/model.log
          cargo test --locked --offline -p cyxia-control-model reward_v2 2>&1 | tee artifacts/control-gates/reward-v2.log
          cargo test --locked --offline -p cyxia-kernel-core --lib offline_config_v1 2>&1 | tee artifacts/control-gates/offline-config.log
          cargo test --locked --offline -p cyxia-kernel-core --lib cap_record_v3 2>&1 | tee artifacts/control-gates/cap-v3.log
          cargo test --locked --offline -p cyxia-kernel-core --lib file_media_v0199 2>&1 | tee artifacts/control-gates/media-v1.log
          cargo test --locked --offline -p cyxia-kernel-core --lib snapshot_restore 2>&1 | tee artifacts/control-gates/snapshot-restore.log
          cargo test --locked --offline -p cyxia-kernel-core --lib ipc_receive_v3 2>&1 | tee artifacts/control-gates/ipc-receive.log
          cargo test --locked --offline -p cyxia-kernel-core --lib syscall_v3 2>&1 | tee artifacts/control-gates/syscall-v3.log
          cargo test --locked --offline -p cyxia-kernel-core --lib file_structure_v1 2>&1 | tee artifacts/control-gates/file-structure.log
          cargo test --locked --offline -p cyxia-kernel-core --lib recovery_v1 2>&1 | tee artifacts/control-gates/recovery-v1.log
          cargo test --locked --offline -p cyxia-kernel-core --lib boot_epoch_v1 2>&1 | tee artifacts/control-gates/boot-pair.log
          (cd tools; python3 -B -m unittest -v test_verify_v0199_verdicts) 2>&1 | tee artifacts/control-gates/verdict-custody.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v020-protected-gate-components-${{ github.sha }}
          path: artifacts/control-gates/
          retention-days: 7
