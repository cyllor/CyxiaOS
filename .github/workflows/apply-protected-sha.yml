name: Apply protected SHA evidence path

on:
  push:
    branches:
      - fix/first-level-subsystems-20261024
    paths:
      - '.github/workflows/apply-protected-sha.yml'
      - '.ci/protected-sha/**'

permissions:
  contents: write

concurrency:
  group: apply-protected-sha
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - name: Check out source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/first-level-subsystems-20261024
          fetch-depth: 0
      - name: Install pinned compiler
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --component rustfmt --component clippy --target aarch64-unknown-none-softfloat
          cargo fetch --locked
      - name: Apply, verify, and self-remove
        env:
          BRANCH: fix/first-level-subsystems-20261024
        run: |
          set -euo pipefail
          python3 .ci/protected-sha/apply.py
          cargo fmt --all
          python3 -B -m unittest discover -s tests/host -p 'test_verification.py' -v
          cargo clippy --locked --offline -p cyxia-kernel --target aarch64-unknown-none-softfloat --features smp-selftest -- -D warnings
          rm -rf .ci/protected-sha .github/workflows/apply-protected-sha.yml
          rmdir .ci 2>/dev/null || true
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: accelerate protected evidence SHA with saved SIMD state"
          git push origin "HEAD:$BRANCH"
