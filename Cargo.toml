[workspace]
resolver = "3"
members = ["crates/peer-billing", "crates/contracts", "crates/cluster-transport", "crates/net-transport", "user/local-echo", "crates/prototype", "crates/control-model", "crates/kernel-core", "crates/arch-aarch64", "crates/arch", "crates/arch-x86_64", "crates/platform-pc", "crates/platform-virt", "crates/driver-pl011", "crates/driver-gicv2", "crates/driver-virtio", "crates/ai-fs", "crates/ai-runtime", "crates/shell", "crates/posix", "kernel"]
default-members = ["crates/contracts", "crates/net-transport", "user/local-echo", "crates/prototype", "crates/control-model", "crates/kernel-core", "crates/arch-aarch64", "crates/arch", "crates/arch-x86_64", "crates/platform-pc", "crates/platform-virt", "crates/driver-pl011", "crates/driver-gicv2", "crates/driver-virtio", "crates/ai-fs", "crates/ai-runtime", "crates/shell", "crates/posix"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

# One audited native TLS crypto implementation for host and AArch64 guests.
# Existing V0.18 no-std ring patch supplies the freestanding AArch64 assembly
# omitted by the registry build. This path is *not* the cluster engine.
[patch.crates-io]
ring = { path = "user/prototype-cluster/vendor/ring" }
