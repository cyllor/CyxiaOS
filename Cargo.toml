[workspace]
resolver = "3"
members = ["crates/contracts", "crates/net-transport", "user/local-echo", "crates/prototype", "crates/control-model", "crates/kernel-core", "crates/arch-aarch64", "crates/arch", "crates/arch-x86_64", "crates/platform-pc", "crates/platform-virt", "crates/driver-pl011", "crates/driver-gicv2", "crates/driver-virtio", "crates/ai-fs", "crates/ai-runtime", "crates/shell", "crates/posix", "kernel"]
# Historical cluster crates are retained only as optional offline migration
# sources; they are not members of the active single-device workspace. Explicit
# dependency edges still need removal before declaring complete de-distribution.
exclude = ["crates/peer-billing", "crates/cluster-transport"]
default-members = ["crates/contracts", "crates/net-transport", "user/local-echo", "crates/prototype", "crates/control-model", "crates/kernel-core", "crates/arch-aarch64", "crates/arch", "crates/arch-x86_64", "crates/platform-pc", "crates/platform-virt", "crates/driver-pl011", "crates/driver-gicv2", "crates/driver-virtio", "crates/ai-fs", "crates/ai-runtime", "crates/shell", "crates/posix"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

# One audited native TLS crypto implementation for host and AArch64 guests.
# Registry ring 0.17.14 lacks the freestanding AArch64 assembly required by the
# soft-float bare-metal targets (docs/implementation/v19-security-six-tracks.md),
# so the audited V0.18 no-std vendored copy is patched in. Relocated from
# user/prototype-cluster/vendor/ring to this neutral repo-root path: V0.20 is
# single-machine, so de-distribution must be able to delete user/prototype-cluster
# without touching TLS crypto. Ring version and content are unchanged.
[patch.crates-io]
ring = { path = "vendor/ring" }
