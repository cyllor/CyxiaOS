[package]
name = "cyxia-cluster-transport"
version = "0.1.0"
edition = "2024"

[features]
default = []
tls = ["dep:rustls", "dep:ring", "dep:getrandom"]

[dependencies]
cyxia-driver-virtio = { path = "../driver-virtio" }
smoltcp = { version = "=0.14.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring"], optional = true }
ring = { version = "=0.17.14", default-features = false, features = ["alloc", "less-safe-getrandom-custom-or-rdrand"], optional = true }
getrandom = { version = "=0.2.17", default-features = false, features = ["custom"], optional = true }
