[package]
name = "cyxia-cluster-transport"
version = "0.1.0"
edition = "2024"

[features]
default = []
tls = ["dep:rustls", "dep:ring", "dep:getrandom", "cyxia-net-transport/tls"]

[dependencies]
# Legacy cluster diagnostics facade. The CXD1 paired-node cluster discovery
# wire and its UDP socket integration live in THIS crate (src/discovery.rs,
# src/tcp/discovering.rs); the active single-machine net-transport crate is
# discovery-free and only supplies the bounded native device/TCP stack.
cyxia-net-transport = { path = "../net-transport", default-features = false, features = ["smoltcp"] }
# The relocated discovery wire rides smoltcp's UDP socket and Ethernet/IPv4
# wire types directly. Same pinned version as net-transport; feature sets
# unify on one crate instance. No proto-ipv6: the CXD1 wire is IPv4-only.
smoltcp = { version = "=0.14.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-udp"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring"], optional = true }
ring = { version = "=0.17.14", default-features = false, features = ["alloc", "less-safe-getrandom-custom-or-rdrand"], optional = true }
getrandom = { version = "=0.2.17", default-features = false, features = ["custom"], optional = true }

# Standalone legacy diagnostics mirror the workspace's audited ring patch so
# `cargo test --manifest-path ... --locked --offline` resolves the same crypto
# source. Ignored when this crate is built inside the main workspace.
# Mirrors the root patch's neutral repo-root vendor/ring location (rationale
# in root Cargo.toml); ring version and content are unchanged.
[patch.crates-io]
ring = { path = "../../vendor/ring" }
