[package]
name = "cyxia-prototype"
version.workspace = true
edition.workspace = true

[dependencies]
sha2 = { version = "=0.10.9", default-features = false }
cyxia-arch = { path = "../arch", optional = true }
cyxia-contracts = { path = "../contracts" }

[features]
# Historical cluster wire codec, offline migration reference only.
legacy-cluster = []
# The engine consumes the wire codec, so it implies legacy-cluster.
cluster-engine = ["legacy-cluster"]
# Legacy D16 (OfferCpu/Placement) wire decode, offline evidence and old-media
# inspection only. Without it the default decode rejects domain 16 cleanly.
# Even with it, the native authorization gate (permitted_v0199_local) still
# rejects D16 effects before any prepare/apply/publish.
legacy-d16-decode = []
hardware-sha256 = ["dep:cyxia-arch"]

[[test]]
name = "cluster_wire"
required-features = ["legacy-cluster"]
