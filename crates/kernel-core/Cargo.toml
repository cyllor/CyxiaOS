[package]
name = "cyxia-kernel-core"
version.workspace = true
edition.workspace = true

[dependencies]
cyxia-contracts = { path = "../contracts" }
cyxia-control-model = { path = "../control-model" }
sha2 = { version = "=0.10.9", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false }

[dev-dependencies]
cyxia-prototype = { path = "../prototype" }

[features]
# Historical dual-node security core, retained only as offline migration
# reference; not part of the single-machine default build.
legacy-cluster = []

[[test]]
name = "cluster"
required-features = ["legacy-cluster"]
