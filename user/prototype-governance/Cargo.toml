[package]
name = "cyxia-prototype-governance"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
cyxia-prototype = { path = "../../crates/prototype" }

[[bin]]
name = "prototype-governance"
path = "main.rs"

[profile.release]
opt-level = 2
panic = "abort"
overflow-checks = true
lto = true
codegen-units = 1
