[package]
name = "cyxia-prototype-learning"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
cyxia-prototype = { path = "../../crates/prototype" }

# The isolated RX/RO image cannot carry a writable CPU-detection cache.
[target.'cfg(target_arch = "x86_64")'.dependencies]
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }

[[bin]]
name = "prototype-learning"
path = "main.rs"

[profile.release]
opt-level = 2
panic = "abort"
overflow-checks = true
lto = true
codegen-units = 1
