[package]
name = "cyxia-local-echo"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
guest = []

[dependencies]
cyxia-net-transport = { path = "../../crates/net-transport", features = ["tls"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring"] }
getrandom = { version = "=0.2.17", default-features = false, features = ["custom"] }

[[bin]]
name = "cyxia-local-echo"
path = "src/main.rs"
test = false
bench = false
required-features = ["guest"]
