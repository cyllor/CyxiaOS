[package]
name = "cyxia-kernel"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cyxia-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# V0.20 canonical default: resident AArch64 startup.
# With no deployment startup authority, it runs trusted read-only diagnostics.
# The isolated fixed-CPU0 fixture stays reachable via
# --no-default-features --features smp-selftest; the retired CPU0 desktop path
# requires the explicit legacy-desktop feature.
default = ["v0199-local-native", "v020-production"]
# The native single-node V0.19.9 release profile must never silently
# activate historical D16/peer-billing or cluster transport paths. Without
# smp-selftest it denotes the retired legacy-desktop reference profile.
v0199-local-native = ["legacy-desktop"]
selftest = ["legacy-desktop"]
# Retired CPU0 desktop exception/boot path (exception_dispatch_primary +
# primary_services), preserved for offline reference and carried by the x86
# platform selftest feature chain. Never part of the default V0.20 aarch64
# production path: every smp-selftest profile excludes it at compile time.
legacy-desktop = []
# Long-running OS composition. Independent of bounded acceptance profiles.
os-runtime = ["legacy-desktop", "cyxia-arch-x86_64/runtime"]
# Explicit x86 production image layout; preserves legacy runtime profiles.
full-os = ["os-runtime", "ported", "large-memory", "cyxia-posix/full-os"]
cosmic-desktop = ["full-os", "graphics"]
# Full-OS COSMIC session profile: widens the process layout to the session slot
# count (cyxia-posix/cosmic-session) and selects the versioned session admission
# policy. New opt-in feature; demo and existing full-os/cosmic-desktop builds are
# unchanged. Guest session acceptance is still required separately.
cosmic-session = ["cosmic-desktop", "cyxia-posix/cosmic-session"]
# Explicit core-service image inventory. The capacity-only session profile above
# remains usable for probes; this profile requires the genuine five programs
# and selects their separate 128 MiB raw ROM catalog (legacy full-os: 96 MiB).
cosmic-core-services-v1 = ["cosmic-session"]
# The genuine clock plus the complete existing core catalog. ROM inputs alone
# have a separate 192 MiB cap (128 MiB core + one 64 MiB FullOs applet).
# Process image/heap/FD/thread and physical pool grants are unchanged.
cosmic-time-applet-v1 = ["cosmic-core-services-v1"]
# Two additional genuine applets, with a separate 256 MiB ROM catalog.
# One-GiB guest; image/stack/heap and physical page pools remain unchanged.
# The separate FD/socket/shared-metadata envelope requires paired native hosts.
cosmic-workspace-applets-v1 = ["cosmic-time-applet-v1", "cyxia-posix/cosmic-applets-v1", "cyxia-ai-runtime/cosmic-applets-v1"]
cosmic-notifications-applet-v1 = [
    "cosmic-workspace-applets-v1",
    "cyxia-posix/cosmic-notifications-applet-v1",
    "cyxia-ai-runtime/cosmic-notifications-applet-v1",
]
cosmic-bg-v1 = ["cosmic-notifications-applet-v1"]
cosmic-app-library-v1 = ["cosmic-bg-v1", "cyxia-posix/cosmic-app-library-v1"]
# Four-vCPU native mechanism acceptance; not the desktop production boot.
smp-selftest = ["selftest"]
# Dedicated V0.19.9 4-vCPU native CPU0 EL0 role/TTBR isolation fixture.
# Not a certification of the 8 real control services or G4.
v0199-cpu0-role-selftest = ["smp-selftest"]
# Native advice-chain E2E fixture: real EL0 AdviceEnvelope v1 -> SVC 0x50 intake
# -> RuleProfile review -> DecisionRecord/Disposition -> SVC 0x50 register and
# SVC 0x41 publish via SvcV3Bridge -> executor ApplyReport -> supervisor terminal.
# Fixture scope only; production in-vector syscall wiring is NOT established.
v0199-advice-e2e-selftest = ["smp-selftest", "dep:sha2"]
# Alternate opt-in name for the CPU0 ABI3 registration and publication fixture.
v0199-cpu0-svc-selftest = ["v0199-advice-e2e-selftest"]
# The production entry shares fixed SMP bring-up. Native diagnostic builds
# opt in to bounded ABI3/trap, network and scratch-media evidence.
v020-production = ["smp-selftest"]
v020-production-diagnostic = ["v020-production", "dep:sha2", "sec-n-native"]
v020-production-media-staging = ["v020-production-diagnostic", "prototype-memory"]
v020-production-authenticated-net = ["v020-production-diagnostic"]
v020-production-media-reopen = ["v020-production-media-staging"]
v020-production-media-signed = ["v020-production-media-staging"]
# Separate signed baseline-v1 file owner on one dedicated test disk.
v020-production-fsync-scratch = ["v020-production-media-signed"]
v020-production-media-envelopes = ["v020-production-media-staging"]
v020-production-media-unified = ["v020-production-media-envelopes"]
v020-production-live-control = ["v020-production-diagnostic"]
v020-production-snapshot-catalog = ["v020-production-media-unified", "v020-production-media-signed", "v020-production-live-control"]
v020-production-file-read = ["v020-production-media-unified", "v020-production-media-signed", "v020-production-live-control"]
v020-production-snapshot-read = ["v020-production-snapshot-catalog", "v020-production-file-read"]
v020-production-file-sessions = ["v020-production-file-read"]
v020-production-file-volatile-write = ["v020-production-file-read"]
v020-production-frame-pool = ["v020-production-diagnostic"]
# Explicit native ABI3 role bootstrap. Never a production G0/BootEpoch claim.
v0199-control-bringup = ["v0199-cpu0-role-selftest"]
# Same diagnostic program inventory with the normative RAM topology; not G0.
v0199-control-bringup-1g = ["v0199-control-bringup", "prototype-memory"]
# Separate native scratch journal, never a production mounted filesystem.
v0199-epoch-disk-selftest = ["v0199-cpu0-role-selftest", "prototype-memory", "dep:sha2"]
# Adds an independent, dedicated VirtIO RNG to the epoch effect fixture.
v0199-d11-rng-selftest = ["v0199-epoch-disk-selftest"]
# Adds two private real CPU1 tasks to verify scheduler weight effects.
v0199-d01-scheduler-selftest = ["v0199-epoch-disk-selftest"]
# Separate native all-zero scratch format fixture: the §9.2.1 formatter
# contract runs against real VirtIO block with guest FLUSH-ordering proof.
# Never a production format path, signed catalog or mounted filesystem.
v0199-format-selftest = ["v0199-cpu0-role-selftest", "prototype-memory", "dep:sha2"]
register-v15-selftest = ["smp-selftest", "prototype-memory"]
ai-control-selftest = ["smp-selftest"]
# Retired dynamic C/B/T/Q control-core migration mechanism, retained only as
# an opt-in historical fixture; never part of the fixed-CPU0 default profile.
legacy-coreset = []
# Four-core EL1 Ethernet driver bring-up only; no TLS/cluster certification.
net-selftest = ["smp-selftest", "prototype-memory"]
# SEC-N single-machine native deployment PREP (dependency + glue + guest
# readiness), not the boot-chain dispatch. Pulls the relocated native smoltcp
# Ethernet/IPv4/TCP stack and its VirtIO port boundary (device/tcp) that the
# future EL1 Echo broker owns. It deliberately does NOT enable the `tls`
# feature: rustls/ring require AArch64 NEON, and the EL1 kernel stays
# aarch64-unknown-none-softfloat (six-tracks record forbids adding NEON to the
# soft-float ABI). The pinned TLS session generation + Admission-bound service
# glue (net-transport::service) therefore compiles for the EL0 guest target
# aarch64-unknown-none and host tests, never for this soft-float closure.
# Default builds never compile cyxia-net-transport. The smp.rs dispatch that
# actually deploys user/local-echo is a separate, still-open gate.
sec-n-native = ["dep:cyxia-net-transport", "cyxia-net-transport/smoltcp"]
# Gated SEC-N native Echo DEPLOYMENT fixture: loads the real cross-compiled
# user/local-echo EL0 image into its own TTBR0/identity and services its SVC 0x43
# broker from a bounded trait-level mock Port, proving the fail-closed deployment
# negatives (identity mismatch, handshake-budget exhaustion, stale generation,
# finish-without-quiescence). The real Admission ledger + rustls TLS run in the EL0
# guest; the EL1 kernel stays soft-float (sec-n-native pulls smoltcp only, never
# tls/rustls/ring). Real VirtIO-net device custody + a real pinned TLS peer (needed
# for the positive Echo turn and finish retirement) remain the open device gap.
# Requires the guest ELF to be built first (tools/verify_v0199_sec_n.py). Never a
# production deployment; the default build is unaffected.
v0199-sec-n-selftest = ["smp-selftest", "sec-n-native", "dep:sha2"]
model-v13-selftest = ["smp-selftest", "prototype-memory"]
storage-v13-selftest = ["smp-selftest", "prototype-memory"]
tcp-v13-selftest = ["smp-selftest", "prototype-memory", "dep:cyxia-cluster-transport"]
prototype-runtime = ["smp-selftest", "prototype-memory"]
# Continuous AI core scheduling and protected authenticated cluster service together.
# The legacy diagnostic path keeps the historical prototype wire codec available.
unified-runtime = ["prototype-runtime", "dep:cyxia-cluster-transport", "dep:sha2", "dep:cyxia-peer-billing", "cyxia-prototype/legacy-cluster"]
prototype-memory = ["cyxia-platform-virt/prototype-memory"]
graphics = []
# The historical desktop/ported reference profiles keep the retired CPU0
# desktop boot/exception path available (aarch64 smithay probes, x86 full-os).
ported = ["legacy-desktop"]
openbox = ["ported"]
gtk = ["openbox"]
pcmanfm = ["openbox"]
lxpanel = ["pcmanfm"]
spawn-test = ["ported"]
mesa-probe = ["ported", "large-memory"]
rust-egl-probe = ["ported", "large-memory"]
rust-reactor-probe = ["ported", "large-memory"]
smithay-probe = ["ported", "large-memory"]
smithay-wayland-probe = ["ported", "large-memory", "graphics"]
smithay-xdg-probe = ["ported", "large-memory", "graphics"]
smithay-multi-probe = ["ported", "large-memory", "graphics"]
smithay-interactive-probe = ["ported", "large-memory", "graphics"]
smithay-resize-probe = ["ported", "large-memory", "graphics"]
smithay-dynamic-probe = ["ported", "large-memory", "graphics"]
wayland-shm-probe = ["ported", "large-memory"]
abi-trace = []
large-memory = ["cyxia-posix/large-memory", "cyxia-platform-virt/large-memory"]

[dependencies]
cyxia-contracts = { path = "../crates/contracts" }
cyxia-kernel-core = { path = "../crates/kernel-core" }
cyxia-control-model = { path = "../crates/control-model" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
cyxia-arch-x86_64 = { path = "../crates/arch-x86_64" }
cyxia-platform-pc = { path = "../crates/platform-pc" }
cyxia-prototype = { path = "../crates/prototype" }
cyxia-shell = { path = "../crates/shell" }
cyxia-ai-runtime = { path = "../crates/ai-runtime" }
cyxia-posix = { path = "../crates/posix" }
cyxia-ai-fs = { path = "../crates/ai-fs" }
cyxia-driver-virtio = { path = "../crates/driver-virtio" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
cyxia-peer-billing = { path = "../crates/peer-billing", optional = true }
sha2 = { version = "=0.10.9", default-features = false, optional = true }
cyxia-cluster-transport = { path = "../crates/cluster-transport", optional = true }
# Single-machine native transport (relocated smoltcp stack). Optional; only the
# sec-n-native feature activates it, and only with the `smoltcp` feature so the
# EL1 soft-float closure never pulls rustls/ring. See sec-n-native above.
cyxia-net-transport = { path = "../crates/net-transport", optional = true }
cyxia-prototype = { path = "../crates/prototype", features = ["hardware-sha256"] }
cyxia-arch-aarch64 = { path = "../crates/arch-aarch64" }
cyxia-platform-virt = { path = "../crates/platform-virt" }
cyxia-driver-pl011 = { path = "../crates/driver-pl011" }
cyxia-driver-gicv2 = { path = "../crates/driver-gicv2" }
cyxia-shell = { path = "../crates/shell" }
cyxia-ai-runtime = { path = "../crates/ai-runtime" }
cyxia-posix = { path = "../crates/posix" }
cyxia-ai-fs = { path = "../crates/ai-fs" }
cyxia-driver-virtio = { path = "../crates/driver-virtio" }
