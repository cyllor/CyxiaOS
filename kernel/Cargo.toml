[package]
name = "cyxia-kernel"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cyxia-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
# The native single-node V0.19.9 release profile must never silently
# activate historical D16/peer-billing or cluster transport paths.
default = ["v0199-local-native"]
v0199-local-native = []
selftest = []
# Long-running OS composition. Independent of bounded acceptance profiles.
os-runtime = ["cyxia-arch-x86_64/runtime"]
# Explicit x86 production image layout; preserves legacy runtime profiles.
full-os = ["os-runtime", "ported", "large-memory", "cyxia-posix/full-os"]
cosmic-desktop = ["full-os", "graphics"]
# Full-OS COSMIC session profile: widens the process layout to the session slot
# count (cyxia-posix/cosmic-session) and selects the versioned session admission
# policy. New opt-in feature; demo and existing full-os/cosmic-desktop builds are
# unchanged. Guest session acceptance is still required separately.
cosmic-session = ["cosmic-desktop", "cyxia-posix/cosmic-session"]
# Explicit core-service image inventory. The capacity-only session profile above
# remains usable for probes; this profile requires the genuine five programs
# and selects their separate 128 MiB raw ROM catalog (legacy full-os: 96 MiB).
cosmic-core-services-v1 = ["cosmic-session"]
# The genuine clock plus the complete existing core catalog. ROM inputs alone
# have a separate 192 MiB cap (128 MiB core + one 64 MiB FullOs applet).
# Process image/heap/FD/thread and physical pool grants are unchanged.
cosmic-time-applet-v1 = ["cosmic-core-services-v1"]
# Two additional genuine applets, with a separate 256 MiB ROM catalog.
# One-GiB guest; image/stack/heap and physical page pools remain unchanged.
# The separate FD/socket/shared-metadata envelope requires paired native hosts.
cosmic-workspace-applets-v1 = ["cosmic-time-applet-v1", "cyxia-posix/cosmic-applets-v1", "cyxia-ai-runtime/cosmic-applets-v1"]
cosmic-notifications-applet-v1 = [
    "cosmic-workspace-applets-v1",
    "cyxia-posix/cosmic-notifications-applet-v1",
    "cyxia-ai-runtime/cosmic-notifications-applet-v1",
]
cosmic-bg-v1 = ["cosmic-notifications-applet-v1"]
cosmic-app-library-v1 = ["cosmic-bg-v1", "cyxia-posix/cosmic-app-library-v1"]
# Four-vCPU native mechanism acceptance; not the desktop production boot.
smp-selftest = ["selftest"]
# Dedicated V0.19.9 4-vCPU native CPU0 EL0 role/TTBR isolation fixture.
# Not a certification of the 8 real control services or G4.
v0199-cpu0-role-selftest = ["smp-selftest"]
# Explicit native ABI3 role bootstrap. Never a production G0/BootEpoch claim.
v0199-control-bringup = ["v0199-cpu0-role-selftest"]
# Same diagnostic program inventory with the normative RAM topology; not G0.
v0199-control-bringup-1g = ["v0199-control-bringup", "prototype-memory"]
# Separate native scratch journal, never a production mounted filesystem.
v0199-epoch-disk-selftest = ["v0199-cpu0-role-selftest", "prototype-memory", "dep:sha2"]
register-v15-selftest = ["smp-selftest", "prototype-memory"]
ai-control-selftest = ["smp-selftest"]
# Retired dynamic C/B/T/Q control-core migration mechanism, retained only as
# an opt-in historical fixture; never part of the fixed-CPU0 default profile.
legacy-coreset = []
# Four-core EL1 Ethernet driver bring-up only; no TLS/cluster certification.
net-selftest = ["smp-selftest", "prototype-memory"]
model-v13-selftest = ["smp-selftest", "prototype-memory"]
storage-v13-selftest = ["smp-selftest", "prototype-memory"]
tcp-v13-selftest = ["smp-selftest", "prototype-memory", "dep:cyxia-cluster-transport"]
prototype-runtime = ["smp-selftest", "prototype-memory"]
# Continuous AI core scheduling and protected authenticated cluster service together.
# The legacy diagnostic path keeps the historical prototype wire codec available.
unified-runtime = ["prototype-runtime", "dep:cyxia-cluster-transport", "dep:sha2", "dep:cyxia-peer-billing", "cyxia-prototype/legacy-cluster"]
prototype-memory = ["cyxia-platform-virt/prototype-memory"]
graphics = []
ported = []
openbox = ["ported"]
gtk = ["openbox"]
pcmanfm = ["openbox"]
lxpanel = ["pcmanfm"]
spawn-test = ["ported"]
mesa-probe = ["ported", "large-memory"]
rust-egl-probe = ["ported", "large-memory"]
rust-reactor-probe = ["ported", "large-memory"]
smithay-probe = ["ported", "large-memory"]
smithay-wayland-probe = ["ported", "large-memory", "graphics"]
smithay-xdg-probe = ["ported", "large-memory", "graphics"]
smithay-multi-probe = ["ported", "large-memory", "graphics"]
smithay-interactive-probe = ["ported", "large-memory", "graphics"]
smithay-resize-probe = ["ported", "large-memory", "graphics"]
smithay-dynamic-probe = ["ported", "large-memory", "graphics"]
wayland-shm-probe = ["ported", "large-memory"]
abi-trace = []
large-memory = ["cyxia-posix/large-memory", "cyxia-platform-virt/large-memory"]

[dependencies]
cyxia-contracts = { path = "../crates/contracts" }
cyxia-kernel-core = { path = "../crates/kernel-core" }
cyxia-control-model = { path = "../crates/control-model" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
cyxia-arch-x86_64 = { path = "../crates/arch-x86_64" }
cyxia-platform-pc = { path = "../crates/platform-pc" }
cyxia-prototype = { path = "../crates/prototype" }
cyxia-shell = { path = "../crates/shell" }
cyxia-ai-runtime = { path = "../crates/ai-runtime" }
cyxia-posix = { path = "../crates/posix" }
cyxia-ai-fs = { path = "../crates/ai-fs" }
cyxia-driver-virtio = { path = "../crates/driver-virtio" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
cyxia-peer-billing = { path = "../crates/peer-billing", optional = true }
sha2 = { version = "=0.10.9", default-features = false, optional = true }
cyxia-cluster-transport = { path = "../crates/cluster-transport", optional = true }
cyxia-prototype = { path = "../crates/prototype", features = ["hardware-sha256"] }
cyxia-arch-aarch64 = { path = "../crates/arch-aarch64" }
cyxia-platform-virt = { path = "../crates/platform-virt" }
cyxia-driver-pl011 = { path = "../crates/driver-pl011" }
cyxia-driver-gicv2 = { path = "../crates/driver-gicv2" }
cyxia-shell = { path = "../crates/shell" }
cyxia-ai-runtime = { path = "../crates/ai-runtime" }
cyxia-posix = { path = "../crates/posix" }
cyxia-ai-fs = { path = "../crates/ai-fs" }
cyxia-driver-virtio = { path = "../crates/driver-virtio" }
