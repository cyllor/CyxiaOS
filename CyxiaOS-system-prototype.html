<script>
// Pure state model: no DOM, network, timers, storage or browser APIs.
const CyxiaSystem=(()=>{
const platforms={arm1:{name:'ARM64 · 单核',cores:1,arch:'AArch64',phase:'首版目标'},arm4:{name:'ARM64 · 四核',cores:4,arch:'AArch64',phase:'未来阶段模拟'},rv1:{name:'RISC-V · 单核',cores:1,arch:'RV64',phase:'未来阶段模拟'}};
const healthNames={OFF:'尚未启动',BOOTING:'启动中',AI_ACTIVE:'AI 模型运行',DEGRADED:'确定性恢复调度',LATCHED:'锁定恢复模式',SELF_TEST:'模型自检中',HALTED:'系统停止派发'};
const phases={EMPTY:'等待反馈',DATA:'反馈已冻结',CANDIDATE:'候选待验证',READY:'候选可启用',OBSERVING:'观察新模型',ACCEPTED:'学习结果已接受',REJECTED:'候选被拒',ROLLED_BACK:'已恢复旧模型'};
const bootStages=['入口与平台','异常与内存','时钟与设备','任务与能力','装载本地模型','模型自检'];
const profiles={interactive:{name:'交互任务',x:[1,.18,.7],mem:8,caps:['ipc']},compute:{name:'计算任务',x:[1,.88,.1],mem:24,caps:[]},message:{name:'消息任务',x:[1,.4,.85],mem:12,caps:['ipc','net']}};
function rng(seed){let v=seed>>>0;return()=>{v=(Math.imul(v,1664525)+1013904223)>>>0;return v/4294967296}}
function samples(seed,n,r){let rand=rng(seed),out=[];for(let i=0;i<n;i++){let x=[1,rand(),rand()],y=(r ? .72-.52*x[1]+.08*x[2] : .12+.62*x[1]+.18*x[2])+(rand()-.5)*.025;out.push({x,y})}return out}
const predict=(w,x)=>Math.max(.02,Math.min(1.2,w.reduce((a,v,i)=>a+v*x[i],0)));
const mse=(w,d)=>d.reduce((a,z)=>a+(predict(w,z.x)-z.y)**2,0)/d.length;
function fit(w,d){w=[...w];for(let e=0;e<100;e++){let g=[0,0,0];for(let z of d){let er=w.reduce((a,v,i)=>a+v*z.x[i],0)-z.y;for(let j=0;j<3;j++)g[j]+=2*er*z.x[j]/d.length}for(let j=0;j<3;j++)w[j]=Math.max(-2,Math.min(2,w[j]-.2*g[j]))}return w}
function task(id,type,core=0){let p=profiles[type];return{id,name:p.name+' '+id,type,x:[...p.x],mem:p.mem,quota:64,caps:[...p.caps],state:'ready',core,cpu:0,wait:0}}
function initial(platform='arm1'){return{platform,boot:0,health:'OFF',time:0,epoch:1,rebuilds:1,policy:'balanced',policyVersion:1,tasks:[],nextTask:101,dispatches:0,aiDispatches:0,decision:null,control:Array(platforms[platform].cores).fill(0),forceBudget:false,migration:null,services:{diagnostic:true,trainer:true,validator:true,publisher:true},devices:{serial:true,timer:true,gic:true,block:true,net:true},ipc:[],ipcDelivered:0,packets:[],sent:0,files:[{id:1,name:'welcome.txt',body:'欢迎来到 CyxiaOS 系统原型。文件只存在当前页面内存中。'}],nextFile:2,fileBackup:null,fileSelection:1,active:{id:'M0',w:[.45,0,0]},previous:null,candidate:null,nextModel:1,learning:{phase:'EMPTY',data:null,batch:0,used:0,period:0,evaluation:null,observe:0,regime:0},logs:[],eventSeq:0,dropped:0,rejections:0,notice:'从启动系统开始，或打开场景导览。每个页面共享同一份系统状态。',error:false}}
const memory=s=>{const reserved=24+5*platforms[s.platform].cores,apps=s.tasks.reduce((a,t)=>a+t.mem,0);return{reserved,apps,free:256-reserved-apps}};
function event(s,title,detail,bad=false){s.notice=detail;s.error=bad;s.logs.unshift({seq:++s.eventSeq,time:s.time,title,detail,epoch:s.epoch,model:s.active.id,policy:s.policyVersion,bad});if(s.logs.length>80){s.logs.pop();s.dropped++}}
function tick(s,ms){s.time+=ms;let p=Math.floor(s.time/100);if(p!==s.learning.period){s.learning.period=p;s.learning.used=0}}
function invalidate(s){if(s.candidate&&s.learning.phase!=='OBSERVING'){s.candidate.validated=false;s.learning.phase='REJECTED'}}
function restore(s,why){if(!s.previous)return false;let old=s.active.id;s.active=structuredClone(s.previous);s.previous=null;s.candidate=null;s.learning.data=null;s.learning.observe=0;s.learning.phase='ROLLED_BACK';s.epoch++;s.health='SELF_TEST';event(s,'模型回退',`${why}：${old} 停用，恢复 ${s.active.id}，代际增至 ${s.epoch}。下一轮完成演示自检。`);return true}
function advanceBoot(s){s.boot++;tick(s,1);if(s.boot===4){s.tasks=[task(101,'interactive'),task(102,'compute',platforms[s.platform].cores>1?1:0),task(103,'message')];s.nextTask=104}if(s.boot===6){s.health='AI_ACTIVE';event(s,'启动自检完成','六个启动阶段已模拟完成。本地演示模型接管任务选择；尚未运行真实 ARM 内核。')}else{s.health='BOOTING';event(s,'启动阶段完成',bootStages[s.boot-1]+'已模拟完成，继续下一阶段。')}}
function reduce(input,a){let s=structuredClone(input);const refuse=t=>{s.rejections++;event(s,'操作被拒绝',t,true);return s};const ready=()=>s.boot===6&&s.health!=='HALTED';
if(a.type==='RESET')return initial(s.platform);
if(a.type==='PLATFORM'){if(s.boot!==0)return refuse('平台只允许在未启动状态配置。重置实验后再切换。');if(!platforms[a.value])return refuse('未知平台。');s=initial(a.value);event(s,'平台配置更新',platforms[a.value].name+' 已选定；多核和第二架构仅用于未来机制模拟。');return s}
if(a.type==='BOOT_NEXT'||a.type==='BOOT_ALL'){if(s.boot===6)return refuse('系统已完成启动。');if(a.type==='BOOT_ALL'){while(s.boot<6)advanceBoot(s)}else advanceBoot(s);return s}
if(a.type==='RUN'){
 if(!ready())return refuse(s.health==='HALTED'?'关键时钟设备失效，系统已停止派发；恢复设备后重置实验。':'请先完成系统启动。');
 if(s.health==='SELF_TEST'){s.health='AI_ACTIVE';s.control=s.control.map(()=>.1);tick(s,10);event(s,'模型自检完成','演示自检通过，继续使用 '+s.active.id+'；没有刷新自动重建机会。');return s}
 let selections=[],start=s.time,reason='模型选择';s.control=s.control.map(()=>0);
 for(let core=0;core<platforms[s.platform].cores;core++){let pool=s.tasks.filter(t=>t.core===core&&t.state==='ready');if(!pool.length)continue;let rows=pool.map(t=>({id:t.id,name:t.name,wait:t.wait,pred:predict(s.active.w,t.x)*5,score:(t.wait+1)/(predict(s.active.w,t.x)*5)*(s.policy==='latency'&&t.type==='interactive'?1.5:s.policy==='throughput'&&t.type==='compute'?1.5:1)}));let protect=pool.find(t=>t.wait>=100);let fallback=s.health!=='AI_ACTIVE'||s.forceBudget;let chosen=protect?[...pool].sort((a,b)=>b.wait-a.wait)[0]:fallback?[...pool].sort((a,b)=>b.wait-a.wait||a.id-b.id)[0]:pool.find(t=>t.id===[...rows].sort((a,b)=>b.score-a.score||a.id-b.id)[0].id);let pred=predict(s.active.w,chosen.x)*5;let slice=protect?.5:fallback?1:pred<1.5?.5:pred<3?1:2;let source=protect?'公平保护':fallback?s.forceBudget?'控制预算回退':'故障恢复调度':'演示模型';if(!fallback&&!protect){s.aiDispatches++;s.control[core]=.1}else if(s.forceBudget)s.control[core]=1;s.dispatches++;chosen.cpu+=slice;selections.push({id:chosen.id,name:chosen.name,core,slice,source});s.decision={seq:s.dispatches,epoch:s.epoch,model:s.active.id,policy:s.policyVersion,core,rows,chosen:chosen.id,slice,source,time:start};reason=source}
 s.tasks.forEach(t=>{if(t.state==='ready')t.wait=selections.some(z=>z.id===t.id)?0:t.wait+10});s.forceBudget=false;tick(s,10);
 let effects=[];if(s.ipc.length&&s.services.diagnostic){let m=s.ipc.shift();s.ipcDelivered++;effects.push('诊断收到任务 '+m.from+' 的消息')}
 if(s.devices.net&&s.packets.length){s.packets.shift();s.sent++;effects.push('发送 1 个模拟包')}

const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,type,attrs='',cls='')=>`<button class="${cls}" data-action="${type}" ${attrs}>${label}</button>`;
const badge=(text,cls='')=>`<span class="badge ${cls}">${text}</span>`;
const kv=(label,value)=>`<div class="kv"><span>${label}</span><b>${value}</b></div>`;
const note=t=>`<div class="note">${t}</div>`;
const panel=(title,body,tag='')=>`<section class="panel"><div class="panelhead"><h2>${title}</h2>${tag}</div>${body}</section>`;
const options=()=>state.tasks.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
const taskNames={ready:'就绪',paused:'已暂停',migrating:'迁移冻结'};
const activeCount=()=>state.tasks.filter(t=>t.state==='ready').length;
const format=t=>Number(t).toFixed(1);
const stateTag=()=>badge(CyxiaSystem.healthNames[state.health],state.health==='AI_ACTIVE'?'good':['DEGRADED','LATCHED','HALTED'].includes(state.health)?'bad':'warn');
function taskTable(){return `<div class="tablewrap"><table><thead><tr><th>任务</th><th>状态 / 归属</th><th>CPU 执行</th><th>就绪等待</th><th>内存</th><th>操作</th></tr></thead><tbody>${state.tasks.map(t=>`<tr class="${state.decision?.chosen===t.id?'selected':''}"><td><b>${esc(t.name)}</b><small style="display:block">ID ${t.id} / 第 1 代</small></td><td>${badge(taskNames[t.state],t.state==='ready'?'':'warn')} <small>CPU ${t.core}</small></td><td>${format(t.cpu)} ms</td><td>${format(t.wait)} ms</td><td>${t.mem} / ${t.quota} MiB</td><td>${btn(t.state==='paused'?'恢复':'暂停',t.state==='paused'?'RESUME':'PAUSE',`data-id="${t.id}"`)}${btn('结束','KILL',`data-id="${t.id}"`,'danger')}</td></tr>`).join('')||'<tr><td colspan="6">尚无应用任务。完成启动或创建任务后显示。</td></tr>'}</tbody></table></div>`}
function memoryBar(){let m=CyxiaSystem.memory(state),parts=[['内核示例',16,'#173650'],['推理',4*CyxiaSystem.platforms[state.platform].cores,'#4676c3'],['审计',CyxiaSystem.platforms[state.platform].cores,'#8da8ce'],['学习池',8,'#9cbaed'],['应用',m.apps,'#245dd8'],['可用',m.free,'#e2ebf3']];return `<div class="memorybar" aria-label="内存分配">${parts.map(([name,n,c])=>`<span title="${name} ${n} MiB" style="width:${n/256*100}%;background:${c}"></span>`).join('')}</div><div class="legend">${parts.map(([name,n,c])=>`<span><i style="background:${c}"></i>${name} ${n} MiB</span>`).join('')}</div>`}
function logs(limit=8){return state.logs.slice(0,limit).map(l=>`<div class="log"><div class="mono">#${l.seq}<small>${format(l.time)} ms</small></div><div><b>${esc(l.title)}</b>${l.bad?' '+badge('拒绝 / 故障','bad'):''}<p>${esc(l.detail)}</p><small>M:${l.model}　E:${l.epoch}　P:${l.policy}</small></div></div>`).join('')||'<div class="empty">启动系统后，事件将在这里出现。</div>'}
function overview(){let s=state,m=CyxiaSystem.memory(s);return panel('启动链',`<div class="steps">${CyxiaSystem.bootStages.map((name,i)=>`<div class="bootstep ${i<s.boot?'done':i===s.boot?'current':''}"><b>${i<s.boot?'✓':i+1} ${name}</b><small>${i<s.boot?'阶段已模拟完成':i===s.boot?'等待推进':'尚未执行'}</small></div>`).join('')}</div><div class="actions">${btn('启动系统','BOOT_ALL','','primary')}${btn('推进一个阶段','BOOT_NEXT')}${btn('运行一轮','RUN')}</div>`,badge(s.boot+' / 6'))+panel('系统运行闭环',`<div class="flow"><button data-page="tasks"><b>观测</b><small>${activeCount()} 个就绪任务<br>只读状态快照</small></button><button data-page="brain" class="focus"><b>本地模型</b><small>${s.active.id} / 代际 ${s.epoch}<br>${s.health==='AI_ACTIVE'?'演示模型决策':'等待或恢复路径'}</small></button><button data-page="security"><b>内核守卫</b><small>权限、版本、预算<br>${s.rejections} 次操作拒绝</small></button><button data-page="tasks"><b>执行</b><small>${s.dispatches} 次派发<br>${CyxiaSystem.platforms[s.platform].cores} 个模拟核</small></button><button data-page="learning"><b>反馈与学习</b><small>${CyxiaSystem.phases[s.learning.phase]}<br>参数有界更新</small></button></div><div class="metrics"><div class="metric"><label>应用 / 可用槽位</label><strong>${s.tasks.length}</strong><small>/ 60</small></div><div class="metric"><label>应用内存</label><strong>${m.apps}</strong><small>MiB</small></div><div class="metric"><label>模型来源派发</label><strong>${s.dispatches?Math.round(s.aiDispatches/s.dispatches*100):0}</strong><small>%（演示）</small></div><div class="metric"><label>自动重建机会</label><strong>${s.rebuilds}</strong><small>/ 1</small></div></div>${note('设计问题：模型、资源服务与恢复机制能否共享一致状态？这个界面是机制观察工具；尚未实现桌面图形栈、真实隔离或 ARM 调度。')}`)+`<div class="grid2">${panel('最近的系统变化',logs(4))}${panel('当前配置',kv('平台',CyxiaSystem.platforms[s.platform].name)+kv('示例物理内存','256 MiB')+kv('系统固定保留',m.reserved+' MiB')+kv('静态系统服务','4 个普通任务槽')+kv('模型运行位置','当前浏览器，合成数据')+kv('模型和文件持久化','无，刷新清空')+'<div class="actions"><button data-page="scenarios">开始场景导览</button></div>')}</div>`}
function tasksPage(){return panel('应用任务',taskTable(),badge(state.tasks.length+' 个应用 + 4 个保留服务'))+panel('创建测试任务',`<div class="formrow"><div class="field"><label for="taskKind">任务类型</label><select id="taskKind"><option value="interactive">交互任务 · 8 MiB · IPC</option><option value="compute">计算任务 · 24 MiB · 无外部能力</option><option value="message">消息任务 · 12 MiB · IPC / 网络</option></select></div><button class="primary" data-form="create">创建任务</button>${btn('运行一轮','RUN')}</div>${note('暂停保留内存；结束释放内存并清理该任务的排队消息。模拟任务 ID 不复用。系统服务槽独立保留，其执行没有完整建模；此页不代表真实线程或调度性能。')}`)}
function brainPage(){let d=state.decision;return `<div class="grid2">${panel('最近一次动作',d?`<div class="pillrow">${badge(d.source)}${badge('CPU '+d.core)}${badge('模型 '+d.model)}</div><div class="metrics"><div class="metric"><label>目标任务</label><strong>${d.chosen}</strong></div><div class="metric"><label>时间片</label><strong>${d.slice}</strong><small>ms</small></div><div class="metric"><label>决策序号</label><strong>${d.seq}</strong></div></div><div class="codebox">动作版本：演示 v1\n控制器代际：${d.epoch}　目标版本：${d.policy}\n虚拟时间：${format(d.time)} ms\n校验：身份 / 代际 / 就绪状态 / 所有权 / 时间片边界</div>`:'<div class="empty">完成启动并运行一轮，查看一次实际计算的演示决策。</div>')}${panel('控制器状态',kv('健康状态',stateTag())+kv('控制器代际',state.epoch)+kv('自动重建机会',state.rebuilds+' / 1')+kv('每核控制额度','1 ms / 10 ms（模拟）')+kv('上轮控制计费',state.control.map((v,i)=>`CPU${i}: ${format(v)}`).join(' / ')+' ms')+`<div class="actions">${btn('注入模型超时','FAULT','','danger')}${btn('重建控制器','RECOVER')}${btn('消耗控制额度','BUDGET')}</div>`)}</div>`+panel('候选任务评分',d?`<div class="tablewrap"><table><thead><tr><th>任务</th><th>等待输入</th><th>模型预测耗时</th><th>演示评分</th><th>选择结果</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${r.name}</td><td>${format(r.wait)} ms</td><td>${r.pred.toFixed(3)} ms</td><td>${r.score.toFixed(3)}</td><td>${r.id===d.chosen?badge('已选择'):'—'}</td></tr>`).join('')}</tbody></table></div>${note('分数 =（等待 + 1）/ 模型预测耗时 × 目标偏好；等待达到 100 ms 时优先触发公平保护。这个演示公式与三参数模型不等于正式四输出策略网络。恢复、公平和预算回退均单独标记。')}`:'<div class="empty">尚无评分快照。</div>')+panel('目标与动作校验',`<div class="formrow"><div class="field"><label for="policySelect">目标配置（静态选项）</label><select id="policySelect"><option value="balanced" ${state.policy==='balanced'?'selected':''}>均衡</option><option value="latency" ${state.policy==='latency'?'selected':''}>交互响应优先</option><option value="throughput" ${state.policy==='throughput'?'selected':''}>批量计算优先</option></select></div><button data-form="policy">应用目标</button>${btn('提交陈旧提案','STALE')}${btn('运行一轮','RUN','','primary')}</div>${note('目标版本改变会使未启用候选失效。规划器暂以静态配置模拟，不使用自然语言执行内核命令。')}`)}
function memoryPage(){let m=CyxiaSystem.memory(state);return panel('256 MiB 示例物理空间',memoryBar()+`<div class="metrics"><div class="metric"><label>系统保留</label><strong>${m.reserved}</strong><small>MiB</small></div><div class="metric"><label>应用已分配</label><strong>${m.apps}</strong><small>MiB</small></div><div class="metric"><label>可申请空间</label><strong>${m.free}</strong><small>MiB</small></div></div>`)+`<div class="grid2">${panel('申请应用内存',`<div class="formrow"><div class="field"><label for="memoryTask">目标任务</label><select id="memoryTask">${options()}</select></div><div class="field"><label for="memoryAmount">增加量 / MiB</label><input id="memoryAmount" type="number" value="16" min="1" max="256"></div><button data-form="allocate" class="primary">申请内存</button></div>${note('任务额度 64 MiB。既检查任务额度，也检查全局剩余量；拒绝后任务和全局分配均不改变。')}`)}${panel('预留池明细',kv('内核 / 启动工作区','16 MiB（演示设定）')+kv('推理控制器','4 MiB × '+CyxiaSystem.platforms[state.platform].cores+' 核')+kv('审计','1 MiB × '+CyxiaSystem.platforms[state.platform].cores+' 核')+kv('学习样本 / 训练 / 验证 / 发布','4 + 2 + 1 + 1 MiB')+note('按 MiB 模拟容量，不包含真实页表、碎片、共享页和页回收协议；不能据此证明隔离或实际占用。'))}</div>`+panel('任务分配',taskTable())}
function learningPage(){let s=state,l=s.learning,e=l.evaluation,labels=['基准项','工作量','阻塞比例'];let w=v=>labels.map((n,i)=>kv(n,v?v[i].toFixed(4):'—')).join('');return panel('学习生命周期',`<div class="stagechain">${['采集反馈','训练候选','独立验证','受控启用','观察 / 接受'].map((name,i)=>`<span class="${({EMPTY:0,DATA:1,CANDIDATE:2,READY:3,OBSERVING:4,ACCEPTED:4})[l.phase]===i?'on':''}">${i+1}. ${name}</span>`).join('')}</div><div class="grid2 equal"><div class="weights"><div><h3>当前 ${s.active.id}</h3>${w(s.active.w)}</div><div><h3>候选 ${s.candidate?.id||'尚无'}</h3>${w(s.candidate?.w)}</div></div><div><div class="small">${e?'最近验证：'+e.beforeId+' / '+e.candidateId:'独立保留集预测误差改善'}</div><div class="biggain">${e?(e.gain*100).toFixed(1)+'%':'尚未验证'}</div>${e?kv('旧版 / 候选 MSE',e.before.toFixed(5)+' / '+e.after.toFixed(5)):''}<div class="small">仅反映该批合成样本预测；结果保留供追溯，不表示候选仍启用或系统加速。</div></div></div><div class="actions">${btn('采集反馈','COLLECT')}${btn('本地训练','TRAIN')}${btn('独立验证','VALIDATE')}${btn('启用候选','ACTIVATE','','primary')}${btn('接受学习结果','ACCEPT')}</div><div class="actions">${btn('切换负载分布','SHIFT')}${btn('切回上一模型','ROLLBACK')}${btn('丢弃候选','DISCARD')}${btn('推进 100 ms','ADVANCE')}</div>`,badge(CyxiaSystem.phases[l.phase]))+`<div class="grid2 equal">${panel('预算与样本',kv('训练服务',s.services.trainer?'在线':'已停止')+kv('训练 / 保留样本',l.data?'96 / 32':'0 / 0')+kv('本周期后台使用',format(l.used)+' / 2.0 ms')+`<div class="bar"><span style="width:${Math.min(100,l.used/2*100)}%"></span></div>`+kv('下次刷新',(100-s.time%100).toFixed(1)+' ms 后')+kv('负载分布',l.regime?'B':'A')+note('本页真实执行小型梯度下降；1.6/0.4 ms 是训练/验证的模拟计费。额度全系统共享，不随核数增加。'))}${panel('发布与观察',kv('父模型',s.candidate?.parent||'—')+kv('候选绑定代际',s.candidate?.epoch||'—')+kv('当前代际',s.epoch)+kv('绑定目标版本',s.candidate?.policy||'—')+kv('上一有效模型',s.previous?.id||'无')+kv('启用后观察',l.observe+' / 3 轮')+(l.observed?kv('观察 MSE / 上版',l.observed.now.toFixed(5)+' / '+l.observed.prior.toFixed(5)):'')+note('候选启用将封存、票据和映射切换压缩为一个事件。实际系统计划采用整数更新及独立验证服务；此处未验证真实内存隔离。'))}</div>`}
function servicesPage(){let rows=[['diagnostic','诊断服务','读取审计、处理诊断端点','AuditRead / IPCReceive'],['trainer','训练服务','只读训练集，写候选区','FeedbackRead / CandidateWrite'],['validator','验证服务','独立保留集与候选检查','ValidationRun'],['publisher','发布服务','封存、版本门控、启用和回退','PublishCandidate']];return panel('系统服务',rows.map(([id,name,desc,caps])=>`<div class="row"><div><b>${name}</b><p>${desc}</p><small>${caps}</small></div>${badge(state.services[id]?'在线':'已停止',state.services[id]?'good':'warn')}<div class="end">${['trainer','diagnostic'].includes(id)?btn(state.services[id]?'停止':'恢复','SERVICE',`data-name="${id}"`):'<small>受保护服务</small>'}</div></div>`).join('')+note('四个服务占普通槽位且保留内存；本原型不完整模拟服务 CPU 执行。停止训练服务会阻止训练，停止诊断服务会暂停 IPC 消费。'))+`<div class="grid2 equal">${panel('诊断端点',`<div class="formrow"><div class="field"><label for="ipcTask">发送任务</label><select id="ipcTask">${options()}</select></div><button data-form="ipc" class="primary">发送诊断请求</button></div><div class="actions">${btn('运行并处理消息','RUN')}</div>`+kv('排队 / 容量',state.ipc.length+' / 8')+kv('累计处理',state.ipcDelivered)+note('只有具有 IPC 端点能力且就绪的任务可以发送。队列满拒绝新消息，不覆盖旧消息。'))}${panel('待处理消息',state.ipc.length?state.ipc.map(m=>`<div class="row"><div><b>任务 ${m.from} → 诊断端点</b><p>${m.text}</p></div>${badge('等待接收')}</div>`).join(''):'<div class="empty">端点队列为空。</div>')}</div>`}
function devicesPage(){let ds=[['serial','PL011 串口','内核诊断输出','首版目标'],['timer','Generic Timer','控制窗口、抢占、时间计量','首版目标'],['gic','GICv2','中断分派','首版目标'],['block','VirtIO 块设备','内存文件演示的可用性开关','未来阶段'],['net','VirtIO 网卡','模拟发送队列','未来阶段']];return panel('设备与依赖',`<div class="tablewrap"><table><thead><tr><th>设备</th><th>依赖用途</th><th>范围</th><th>状态</th><th>操作</th></tr></thead><tbody>${ds.map(([id,n,dep,phase])=>`<tr><td><b>${n}</b></td><td>${dep}</td><td>${phase}</td><td>${badge(state.devices[id]?'在线':'离线',state.devices[id]?'good':'bad')}</td><td>${btn(state.devices[id]?'模拟离线':'恢复设备','DEVICE',`data-name="${id}"`,state.devices[id]?'danger':'')}</td></tr>`).join('')}</tbody></table></div>${note('定时器或中断控制器离线会进入停止派发状态，须重置实验。串口离线仅影响设想中的串口输出，页面审计仍保留。这里没有探测或控制宿主机设备。')}`)+panel('依赖方向',`<div class="flow"><button data-page="tasks"><b>系统机制</b><small>任务、内存与 IPC</small></button><button data-page="platform"><b>平台契约</b><small>逻辑 CPU / 时间 / 地址</small></button><button data-page="platform"><b>架构适配</b><small>上下文、页表和异常</small></button><button data-page="devices"><b>具体驱动</b><small>设备接口和 IRQ</small></button><button data-page="audit"><b>故障反馈</b><small>有界诊断与恢复</small></button></div>`)}
function filesPage(){let f=state.files.find(z=>z.id===fileId)||state.files.find(z=>z.id===state.fileSelection)||state.files[0];return `<div class="grid2 equal">${panel('内存文件',state.files.map(z=>`<div class="row"><div><button class="linkbutton" data-file="${z.id}">${esc(z.name)}</button><p>${z.body.length} 字符 / 本次会话</p></div>${btn('删除','FILE_DELETE',`data-id="${z.id}"`,'danger')}</div>`).join('')||'<div class="empty">尚无文件。新建一条笔记。</div>',badge(state.devices.block?'块设备在线':'块设备离线',state.devices.block?'good':'bad'))}${panel(f?esc(f.name):'文件内容',f?`<div class="codebox">${esc(f.body)}</div>`:'<div class="empty">选择文件后查看内容。</div>')}</div>`+panel('新建笔记',`<div class="formrow"><div class="field"><label for="fileName">文件名</label><input id="fileName" value="notes-${state.nextFile}.txt" maxlength="40"></div></div><div class="field" style="margin-top:12px"><label for="fileBody">内容</label><textarea id="fileBody" maxlength="4096" placeholder="记录这次系统实验……"></textarea></div><div class="actions"><button class="primary" data-form="file">创建内存文件</button></div>`)+panel('文件快照',kv('当前快照',state.fileBackup?state.fileBackup.files.length+' 个文件 / '+format(state.fileBackup.time)+' ms':'尚未建立')+`<div class="actions">${btn('建立文件快照','FILE_BACKUP')}${btn('恢复文件快照','FILE_RESTORE')}</div>`+note('这是文件层的未来机制模拟。快照只包含内存文件；恢复会替换当前文件列表，不恢复模型、任务、权限或代际。快照和文件都不会跨刷新保存。'))}
function networkPage(){return `<div class="grid2 equal">${panel('模拟回环链路',kv('网卡状态',badge(state.devices.net?'在线':'离线',state.devices.net?'good':'bad'))+kv('目标端点','页面内 echo://cyxia')+kv('排队 / 上限',state.packets.length+' / 8 包')+kv('已发送',state.sent+' 包 / '+state.sent*256+' 字节')+`<div class="actions">${btn(state.devices.net?'断开链路':'恢复链路','DEVICE','data-name="net"')}${btn('运行发送队列','RUN')}</div>`+note('不调用网络接口、不建立真实连接。模拟包每个 256 字节；链路离线时拒绝新包并保留已排队包。'))}${panel('申请发送',`<div class="formrow"><div class="field"><label for="networkTask">发送任务</label><select id="networkTask">${options()}</select></div><button data-form="send" class="primary">发送模拟包</button></div>`+note('默认消息任务具备网络发送能力；交互和计算任务没有。更改选择可以体验权限拒绝。'))}</div>`+panel('发送队列',state.packets.length?`<div class="tablewrap"><table><thead><tr><th>队列位置</th><th>任务</th><th>大小</th><th>等待原因</th></tr></thead><tbody>${state.packets.map((p,i)=>`<tr><td>${i+1}</td><td>${p.from}</td><td>${p.bytes} 字节</td><td>${state.devices.net?'等待下一运行轮次':'链路离线'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">当前没有排队数据。</div>')}
function securityPage(){let rows=[['交互任务','自身额度','诊断端点','—','—','—'],['计算任务','自身额度','—','—','—','—'],['消息任务','自身额度','诊断端点','发送','—','—'],['诊断服务','自身额度','接收','—','只读','—'],['训练服务','训练工作区','—','—','—','只写候选'],['验证服务','独立验证区','—','—','—','只读候选 / 验证票据'],['发布服务','发布工作区','—','—','—','受控启用'],['AI 控制器','只读模型 / 自身工作区','—','—','—','调度提案']];return panel('静态能力矩阵',`<div class="tablewrap"><table><thead><tr><th>主体</th><th>内存</th><th>IPC</th><th>网络</th><th>审计</th><th>模型 / 调度</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td>${i===0?'<b>'+v+'</b>':v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`+note('第一版采用静态授予能力。用户账号、登录认证、RBAC、可信启动和完整安全产品能力尚无可用实现；此矩阵展示内核对象授权契约，不等同于已通过安全验证。'))+`<div class="grid2 equal">${panel('尝试越过边界',`<p>以普通应用身份请求写当前模型页。预期拒绝，参数保持不变。</p><div class="actions">${btn('尝试写当前模型','DENY_WRITE','','danger')}${btn('提交陈旧提案','STALE')}</div>`)}${panel('已授权访问',`<p>诊断服务可以读取审计，不因此获得模型写权限或调度权。</p><div class="actions">${btn('诊断读取审计','READ_AUDIT')}</div>`+kv('累计拒绝操作',state.rejections)+kv('当前模型',state.active.id))}</div>`}
function platformPage(){let p=CyxiaSystem.platforms[state.platform];return panel('冷启动配置',`<div class="formrow"><div class="field"><label for="platformSelect">平台配置</label><select id="platformSelect">${Object.entries(CyxiaSystem.platforms).map(([id,p])=>`<option value="${id}" ${id===state.platform?'selected':''}>${p.name} · ${p.phase}</option>`).join('')}</select></div><button data-form="platform">应用平台配置</button>${btn('启动系统','BOOT_ALL','','primary')}</div>`+note('配置只能在未启动时修改；应用配置会清空当前未启动实验。ARM64、QEMU virt 和内存容量为设计建议。四核和 RISC-V 仅示意接口与归属，不代表平台已经移植成功。'))+panel('每核执行域',`<div class="grid${p.cores>1?'2 equal':'3'}">${Array.from({length:p.cores},(_,i)=>`<div class="core"><h3>CPU ${i} ${badge(state.boot===6?'模拟在线':'待启动')}</h3><small>独立就绪队列 / 控制账本</small>${state.tasks.filter(t=>t.core===i).map(t=>`<div class="taskchip">${t.name}　${taskNames[t.state]}</div>`).join('')||'<div class="empty">没有归属任务</div>'}<div class="small">上轮控制计费 ${format(state.control[i])} ms</div></div>`).join('')}</div>`)+`<div class="grid2 equal">${panel('归属迁移事务',`<div class="formrow"><div class="field"><label for="migrateTask">任务</label><select id="migrateTask">${options()}</select></div><div class="field"><label for="migrateCore">目标核</label><select id="migrateCore">${Array.from({length:p.cores},(_,i)=>`<option value="${i}">CPU ${i}</option>`).join('')}</select></div></div><div class="actions"><button data-form="migrate">准备迁移</button>${btn('提交迁移','MIGRATE_COMMIT','','primary')}${btn('取消迁移','MIGRATE_CANCEL')}</div>`+note(state.migration?`任务 ${state.migration.id}：CPU ${state.migration.from} 已冻结，等待转移到 CPU ${state.migration.to}。`:'准备时冻结源任务，提交后才改变归属；单核不能迁移。缓存、IPI、TLB 和弱内存序未在浏览器实现。'))}${panel('解耦契约',kv('kernel-core','任务 / 能力 / IPC / 预算')+kv('arch','上下文 / 异常 / 页表编码')+kv('platform','启动信息 / CPU / 设备发现')+kv('drivers','串口 / 中断 / 块设备 / 网络')+note('跨平台保证目标是源码与协议可移植，不是应用二进制跨指令集通用。'))}</div>`}
function auditPage(){return panel('事件记录',`<div class="formrow"><div class="field auditfilter"><label for="auditSearch">按事件内容筛选</label><input id="auditSearch" placeholder="例如：拒绝、模型、内存"></div><button id="exportAudit">下载本次审计 JSON</button></div><div class="pillrow" style="margin:15px 0">${badge('保留 '+state.logs.length+' / 80 条')}${badge('累计 '+state.eventSeq+' 条')}${badge('已覆盖 '+state.dropped+' 条',state.dropped?'warn':'')}</div><div id="auditRows">${logs(80)}</div>`+note('事件包含虚拟时间、模型、控制器代际和目标版本。仅保留最近 80 条；这不是完整运行重放，也不构成系统安全证据。'))}
function scenariosPage(){return `<div class="scenarios">${scenarios.map((s,i)=>`<button class="scenario" data-scenario="${s.id}"><b>${s.name}</b><small>${s.desc}</small>${badge(s.steps.length+' 个步骤')}${s.platform==='arm4'?' '+badge('未来四核模拟','warn'):''}</button>`).join('')}</div>`+note('选择场景会重置本页模拟数据并加载对应平台。导览步骤会自动切到相关功能页；侧栏浏览不打断导览，自由操作会退出导览。')}
const views={overview,tasks:tasksPage,brain:brainPage,memory:memoryPage,learning:learningPage,services:servicesPage,devices:devicesPage,files:filesPage,network:networkPage,security:securityPage,platform:platformPage,audit:auditPage,scenarios:scenariosPage};
function render(){let p=pages.find(p=>p[0]===page);$('nav').innerHTML=pages.map(([id,name,,,,path])=>`<button data-page="${id}" class="${id===page?'active':''}" ${id===page?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${path}"/></svg>${name}</button>`).join('');$('topHealth').innerHTML=`<i class="dot ${state.health==='AI_ACTIVE'?'':'off'}"></i>${CyxiaSystem.healthNames[state.health]}`;$('topPlatform').textContent=CyxiaSystem.platforms[state.platform].name;$('topTime').textContent=format(state.time)+' ms';$('pagehead').innerHTML=`<div><h1>${p[2]}</h1><p>${p[3]}</p></div><span class="tag">${p[4]}</span>`;$('notice').textContent=state.notice;$('notice').className='statusbox'+(state.error?' error':'');$('main').innerHTML=views[page]();let g=scenarios.find(s=>s.id===guideId);$('guide').innerHTML=g?`<section class="guidebar" aria-label="场景进度"><div><b>${g.name}</b><small>${guideStep} / ${g.steps.length} 已完成${guideStep===g.steps.length?' · 可以检查各页状态或重启场景':''}</small></div>${guideStep<g.steps.length?`<button id="guideNext">${guideStep+1}. ${g.steps[guideStep][0]}</button>`:'<button id="guideRestart">重新开始此场景</button>'}<button class="guideexit" id="guideExit">退出导览</button></section>`:'';}
function perform(a,free=true){if(free){guideId=null;guideStep=0}state=CyxiaSystem.reduce(state,a);render()}
function startScenario(id){let s=scenarios.find(z=>z.id===id);state=CyxiaSystem.initial(s.platform);guideId=id;guideStep=0;fileId=null;page=s.steps[0][1];state.notice='场景已重置：'+s.desc+' 使用下方步骤按钮继续。';render()}
document.addEventListener('click',e=>{let n=e.target.closest('[data-page]');if(n){page=n.dataset.page;render();return}let a=e.target.closest('[data-action]');if(a){perform({type:a.dataset.action,id:a.dataset.id,name:a.dataset.name,kind:a.dataset.kind,amount:a.dataset.amount});return}let g=e.target.closest('[data-scenario]');if(g){startScenario(g.dataset.scenario);return}if(e.target.closest('#guideNext')){let sc=scenarios.find(z=>z.id===guideId);if(sc&&guideStep<sc.steps.length){let st=sc.steps[guideStep];page=st[1];state=CyxiaSystem.reduce(state,st[2]);guideStep++;render()}return}if(e.target.closest('#guideRestart')){startScenario(guideId);return}if(e.target.closest('#guideExit')){guideId=null;render();return}let f=e.target.closest('[data-file]');if(f){fileId=Number(f.dataset.file);render();return}let form=e.target.closest('[data-form]');if(form){let a;switch(form.dataset.form){case'create':a={type:'CREATE',kind:$('taskKind').value};break;case'allocate':a={type:'ALLOC',id:$('memoryTask').value,amount:$('memoryAmount').value};break;case'policy':a={type:'POLICY',value:$('policySelect').value};break;case'ipc':a={type:'IPC',id:$('ipcTask').value};break;case'send':a={type:'SEND',id:$('networkTask').value};break;case'file':a={type:'FILE_ADD',name:$('fileName').value,body:$('fileBody').value};break;case'platform':a={type:'PLATFORM',value:$('platformSelect').value};break;case'migrate':a={type:'MIGRATE_PREPARE',id:$('migrateTask').value,to:$('migrateCore').value};break}if(a)perform(a);return}if(e.target.closest('#exportAudit')){const blob=new Blob([JSON.stringify({prototype:true,scope:'browser simulation, not OS evidence',platform:state.platform,total:state.eventSeq,dropped:state.dropped,events:state.logs},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CyxiaOS-prototype-audit.json';a.click();URL.revokeObjectURL(url);}});
document.addEventListener('input',e=>{if(e.target.id==='auditSearch'){let q=e.target.value.toLowerCase();document.querySelectorAll('#auditRows .log').forEach(el=>{el.hidden=!el.textContent.toLowerCase().includes(q)})}});
render();
</script></body></html>
